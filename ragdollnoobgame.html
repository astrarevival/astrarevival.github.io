<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragdoll Noob</title>
<link rel="icon" href="images/astraicontransparent.ico">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 10%, rgba(139,92,246,.28), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(99,102,241,.20), transparent 35%),
        linear-gradient(135deg,#090612,#160c2b 50%,#090612);
}

body {
    min-height: 100vh;
    padding: 18px;
}

.topbar {
    width: min(1200px,100%);
    margin: 0 auto 18px;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 19px;
}

.brand img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

button {
    font: inherit;
}

.back,
.control-btn {
    color: white;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.065);
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
}

.back {
    padding: 9px 14px;
}

.control-btn {
    padding: 11px 14px;
}

.back:hover,
.control-btn:hover {
    background: rgba(255,255,255,.12);
}

.wrapper {
    width: min(1200px,100%);
    margin: auto;
}

.game-card {
    padding: 20px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.055);
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 70px rgba(0,0,0,.3);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 16px;
}

.title-area h1 {
    margin: 0;
    font-size: clamp(25px,4vw,38px);
}

.title-area p {
    margin: 5px 0 0;
    color: rgba(255,255,255,.55);
    font-size: 14px;
}

.status {
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(139,92,246,.14);
    border: 1px solid rgba(139,92,246,.28);
    color: #c4b5fd;
    font-size: 13px;
    white-space: nowrap;
}

.canvas-wrap {
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.1);
    background: #08080c;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
    cursor: grab;
    touch-action: none;
}

canvas.grabbing {
    cursor: grabbing;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

.spawn-menu {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(0,0,0,.2);
    border: 1px solid rgba(255,255,255,.08);
}

.spawn-menu.open {
    display: flex;
}

.instructions {
    margin-top: 15px;
    padding: 13px 15px;
    border-radius: 14px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
    color: rgba(255,255,255,.62);
    font-size: 13px;
    line-height: 1.6;
}

.footer {
    text-align: center;
    color: rgba(255,255,255,.38);
    font-size: 12px;
    margin-top: 18px;
}

@media(max-width:650px) {
    body {
        padding: 10px;
    }

    .game-card {
        padding: 12px;
        border-radius: 18px;
    }

    .control-btn {
        flex: 1 1 calc(50% - 8px);
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="brand">
        <img src="images/astraicontransparent.ico" alt="Astra">
        <span>Astra</span>
    </div>

    <button class="back" onclick="location.href='index.html'">
        ← Back
    </button>
</div>

<main class="wrapper">
<section class="game-card">

    <div class="header">
        <div class="title-area">
            <h1>Ragdoll Noob</h1>
            <p>Throw him around. There is absolutely no objective.</p>
        </div>

        <div class="status">
            Physics Sandbox
        </div>
    </div>

    <div class="canvas-wrap">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div class="controls">
        <button class="control-btn" id="spawnButton">➕ Spawn</button>
        <button class="control-btn" id="boomButton">💥 Cartoon BOOM</button>
        <button class="control-btn" id="resetButton">🔄 Reset Noob</button>
        <button class="control-btn" id="clearButton">🗑️ Clear Objects</button>
    </div>

    <div class="spawn-menu" id="spawnMenu">
        <button class="control-btn" id="crateButton">🧱 Crate</button>
        <button class="control-btn" id="ballButton">⚽ Ball</button>
        <button class="control-btn" id="bombButton">💣 Cartoon Bomb</button>
    </div>

    <div class="instructions">
        <strong>Controls:</strong>
        Grab the Noob or objects and throw them around.
        R = reset · C = crate · B = ball · X = bomb · Space = BOOM
    </div>

</section>

<div class="footer">
    Ragdoll Noob · An Astra game
</div>
</main>

<script>
/* =========================================================
   RAGDOLL NOOB
   Stable ragdoll physics
   Completely silent
   ========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const FLOOR_Y = HEIGHT - 35;

/*
    Canvas Y increases downward.

    Positive gravity = DOWN.
*/

const GRAVITY = 0.38;
const AIR_DRAG = 0.992;
const FLOOR_FRICTION = 0.84;

const ragdoll = {
    head: null,
    torso: null,
    leftArm: null,
    rightArm: null,
    leftLeg: null,
    rightLeg: null
};

let objects = [];
let particles = [];

let grabbedBody = null;

const pointer = {
    x: 0,
    y: 0,
    down: false
};

/* =========================================================
   BODY
   ========================================================= */

class Body {

    constructor(x,y,width,height,options={}) {

        this.x = x;
        this.y = y;

        this.width = width;
        this.height = height;

        this.vx = options.vx || 0;
        this.vy = options.vy || 0;

        this.mass = options.mass || 1;

        this.type = options.type || "body";

        this.angle = options.angle || 0;
        this.angularVelocity =
            options.angularVelocity || 0;

        this.restitution =
            options.restitution ?? 0.15;

        this.friction =
            options.friction ?? FLOOR_FRICTION;

        this.grabbed = false;
    }

    integrate() {

        if (this.grabbed) {
            return;
        }

        /*
         * Gravity pulls DOWN.
         */
        this.vy += GRAVITY;

        this.vx *= AIR_DRAG;
        this.vy *= AIR_DRAG;

        this.x += this.vx;
        this.y += this.vy;

        this.angle += this.angularVelocity;
        this.angularVelocity *= 0.985;
    }

    collideWithWorld() {

        if (this.grabbed) {
            return;
        }

        const halfW = this.width / 2;
        const halfH = this.height / 2;

        /*
         * Floor
         */

        if (this.y + halfH > FLOOR_Y) {

            this.y = FLOOR_Y - halfH;

            if (this.vy > 0) {
                this.vy *= -this.restitution;
            }

            this.vx *= this.friction;

            if (Math.abs(this.vy) < 0.18) {
                this.vy = 0;
            }
        }

        /*
         * Left wall
         */

        if (this.x - halfW < 0) {

            this.x = halfW;

            if (this.vx < 0) {
                this.vx *= -this.restitution;
            }
        }

        /*
         * Right wall
         */

        if (this.x + halfW > WIDTH) {

            this.x = WIDTH - halfW;

            if (this.vx > 0) {
                this.vx *= -this.restitution;
            }
        }

        /*
         * Ceiling.
         */

        if (this.y - halfH < 0) {

            this.y = halfH;

            if (this.vy < 0) {
                this.vy *= -this.restitution;
            }
        }
    }
}

/* =========================================================
   CREATE RAGDOLL
   ========================================================= */

function createRagdoll() {

    ragdoll.head = new Body(
        480,
        145,
        50,
        50,
        {
            mass: 1,
            type: "head",
            restitution: 0.08
        }
    );

    ragdoll.torso = new Body(
        480,
        215,
        52,
        65,
        {
            mass: 2.5,
            type: "torso",
            restitution: 0.05
        }
    );

    ragdoll.leftArm = new Body(
        440,
        215,
        28,
        62,
        {
            mass: 0.8,
            type: "arm",
            angle: -0.08,
            restitution: 0.08
        }
    );

    ragdoll.rightArm = new Body(
        520,
        215,
        28,
        62,
        {
            mass: 0.8,
            type: "arm",
            angle: 0.08,
            restitution: 0.08
        }
    );

    ragdoll.leftLeg = new Body(
        466,
        292,
        30,
        70,
        {
            mass: 1,
            type: "leg",
            restitution: 0.08
        }
    );

    ragdoll.rightLeg = new Body(
        494,
        292,
        30,
        70,
        {
            mass: 1,
            type: "leg",
            restitution: 0.08
        }
    );
}

createRagdoll();

/* =========================================================
   PARTS
   ========================================================= */

function getParts() {

    return [
        ragdoll.head,
        ragdoll.torso,
        ragdoll.leftArm,
        ragdoll.rightArm,
        ragdoll.leftLeg,
        ragdoll.rightLeg
    ];
}

/* =========================================================
   STABLE RAGDOLL JOINTS
   =========================================================

   Instead of trying to force every body part to a single
   distance using huge corrections, each joint has a safe
   maximum stretch.

   This prevents:
   - head separation
   - leg separation
   - limbs shooting away
   - physics explosions
   ========================================================= */

const joints = [
    {
        a: "head",
        b: "torso",
        min: 42,
        max: 50,
        strength: 0.55
    },

    {
        a: "leftArm",
        b: "torso",
        min: 34,
        max: 47,
        strength: 0.48
    },

    {
        a: "rightArm",
        b: "torso",
        min: 34,
        max: 47,
        strength: 0.48
    },

    {
        a: "leftLeg",
        b: "torso",
        min: 36,
        max: 49,
        strength: 0.55
    },

    {
        a: "rightLeg",
        b: "torso",
        min: 36,
        max: 49,
        strength: 0.55
    }
];

function solveJoint(joint) {

    const a = ragdoll[joint.a];
    const b = ragdoll[joint.b];

    if (!a || !b) return;

    let dx = b.x - a.x;
    let dy = b.y - a.y;

    let dist = Math.sqrt(
        dx * dx +
        dy * dy
    );

    if (dist < 0.001) {
        return;
    }

    /*
     * Only correct when the joint is outside
     * its safe range.
     */

    if (
        dist >= joint.min &&
        dist <= joint.max
    ) {
        return;
    }

    const nx = dx / dist;
    const ny = dy / dist;

    let target;

    if (dist < joint.min) {
        target = joint.min;
    } else {
        target = joint.max;
    }

    const error = dist - target;

    /*
     * Never apply a gigantic correction.
     */

    const correction =
        Math.min(
            Math.abs(error),
            8
        ) * joint.strength;

    const moveX =
        nx * correction;

    const moveY =
        ny * correction;

    /*
     * Grabbed objects stay under the cursor.
     */

    if (!a.grabbed) {
        a.x += moveX * 0.5;
        a.y += moveY * 0.5;
    }

    if (!b.grabbed) {
        b.x -= moveX * 0.5;
        b.y -= moveY * 0.5;
    }

    /*
     * Soft velocity damping.
     */

    const rvx = b.vx - a.vx;
    const rvy = b.vy - a.vy;

    const damping = 0.035;

    if (!a.grabbed) {
        a.vx += rvx * damping;
        a.vy += rvy * damping;
    }

    if (!b.grabbed) {
        b.vx -= rvx * damping;
        b.vy -= rvy * damping;
    }
}

/* =========================================================
   RAGDOLL UPDATE
   ========================================================= */

function updateRagdoll() {

    const parts = getParts();

    for (const body of parts) {
        body.integrate();
    }

    /*
     * A few gentle passes instead of aggressive correction.
     */

    for (let i = 0; i < 4; i++) {

        for (const joint of joints) {
            solveJoint(joint);
        }

        for (const body of parts) {
            body.collideWithWorld();
        }
    }
}

/* =========================================================
   SPAWN OBJECTS
   ========================================================= */

function spawnCrate(
    x = random(100,WIDTH - 100),
    y = 80
) {

    const crate = new Body(
        x,
        y,
        44,
        44,
        {
            mass: 2,
            type: "crate",
            restitution: 0.25,
            friction: 0.78
        }
    );

    crate.vx = random(-2,2);
    crate.vy = random(-1,1);

    objects.push(crate);
}

function spawnBall(
    x = random(100,WIDTH - 100),
    y = 80
) {

    const ball = new Body(
        x,
        y,
        36,
        36,
        {
            mass: 0.7,
            type: "ball",
            restitution: 0.72,
            friction: 0.93
        }
    );

    ball.vx = random(-3,3);
    ball.vy = random(-3,1);

    objects.push(ball);
}

function spawnBomb(
    x = random(100,WIDTH - 100),
    y = 80
) {

    const bomb = new Body(
        x,
        y,
        40,
        40,
        {
            mass: 1.3,
            type: "bomb",
            restitution: 0.35,
            friction: 0.82
        }
    );

    bomb.vx = random(-2,2);
    bomb.vy = random(-2,1);
    bomb.fuse = 180;

    objects.push(bomb);
}

/* =========================================================
   OBJECT UPDATE
   ========================================================= */

function updateObjects() {

    for (
        let i = objects.length - 1;
        i >= 0;
        i--
    ) {

        const obj = objects[i];

        obj.integrate();
        obj.collideWithWorld();

        if (obj.type === "bomb") {

            obj.fuse--;

            if (obj.fuse <= 0) {

                explode(
                    obj.x,
                    obj.y,
                    170
                );

                objects.splice(i,1);
            }
        }
    }

    /*
     * Object collisions.
     */

    for (let i = 0; i < objects.length; i++) {

        for (
            let j = i + 1;
            j < objects.length;
            j++
        ) {

            simpleCollision(
                objects[i],
                objects[j]
            );
        }
    }

    /*
     * Ragdoll-object collisions.
     */

    for (const part of getParts()) {

        for (const obj of objects) {

            simpleCollision(
                part,
                obj
            );
        }
    }
}

/* =========================================================
   SIMPLE COLLISION
   ========================================================= */

function simpleCollision(a,b) {

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const dist = Math.sqrt(
        dx * dx +
        dy * dy
    );

    const radiusA =
        Math.max(a.width,a.height) * 0.42;

    const radiusB =
        Math.max(b.width,b.height) * 0.42;

    const minimum =
        radiusA + radiusB;

    if (
        dist >= minimum ||
        dist < 0.001
    ) {
        return;
    }

    const nx = dx / dist;
    const ny = dy / dist;

    const overlap =
        minimum - dist;

    /*
     * Keep the separation correction small.
     */

    const correction =
        Math.min(overlap,6);

    if (!a.grabbed) {

        a.x -=
            nx * correction * 0.5;

        a.y -=
            ny * correction * 0.5;
    }

    if (!b.grabbed) {

        b.x +=
            nx * correction * 0.5;

        b.y +=
            ny * correction * 0.5;
    }

    const rvx =
        b.vx - a.vx;

    const rvy =
        b.vy - a.vy;

    const velocity =
        rvx * nx +
        rvy * ny;

    if (velocity > 0) {
        return;
    }

    const bounce = 0.18;

    const impulse =
        -(1 + bounce) *
        velocity /
        (1 / a.mass + 1 / b.mass);

    if (!a.grabbed) {

        a.vx -=
            nx * impulse / a.mass;

        a.vy -=
            ny * impulse / a.mass;
    }

    if (!b.grabbed) {

        b.vx +=
            nx * impulse / b.mass;

        b.vy +=
            ny * impulse / b.mass;
    }
}

/* =========================================================
   EXPLOSION
   ========================================================= */

function explode(x,y,radius=170) {

    for (const body of getParts()) {

        pushFromExplosion(
            body,
            x,
            y,
            radius
        );
    }

    for (const obj of objects) {

        pushFromExplosion(
            obj,
            x,
            y,
            radius
        );
    }

    for (let i = 0; i < 34; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            random(2,7);

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: random(20,40),
            size: random(3,8)
        });
    }
}

function pushFromExplosion(
    body,
    x,
    y,
    radius
) {

    const dx =
        body.x - x;

    const dy =
        body.y - y;

    const dist =
        Math.sqrt(dx * dx + dy * dy);

    if (
        dist >= radius ||
        dist < 0.01
    ) {
        return;
    }

    const strength =
        (1 - dist / radius) * 12;

    body.vx +=
        dx / dist * strength;

    body.vy +=
        dy / dist * strength - 2;

    body.angularVelocity +=
        random(-0.15,0.15);
}

/* =========================================================
   POINTER
   ========================================================= */

function updatePointer(event) {

    const rect =
        canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (
        event.touches &&
        event.touches.length
    ) {

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    } else {

        clientX =
            event.clientX;

        clientY =
            event.clientY;
    }

    pointer.x =
        (clientX - rect.left) *
        WIDTH / rect.width;

    pointer.y =
        (clientY - rect.top) *
        HEIGHT / rect.height;
}

function getAllBodies() {

    return [
        ...getParts(),
        ...objects
    ];
}

function findBody() {

    let closest = null;
    let bestDistance = Infinity;

    for (const body of getAllBodies()) {

        const dx =
            pointer.x - body.x;

        const dy =
            pointer.y - body.y;

        const dist =
            Math.sqrt(dx * dx + dy * dy);

        const hit =
            Math.max(
                body.width,
                body.height
            ) * 0.7;

        if (
            dist < hit &&
            dist < bestDistance
        ) {

            closest = body;
            bestDistance = dist;
        }
    }

    return closest;
}

function beginGrab(event) {

    updatePointer(event);

    pointer.down = true;

    grabbedBody =
        findBody();

    if (grabbedBody) {

        grabbedBody.grabbed = true;

        canvas.classList.add(
            "grabbing"
        );
    }
}

function moveGrab(event) {

    updatePointer(event);

    if (!grabbedBody) {
        return;
    }

    const dx =
        pointer.x - grabbedBody.x;

    const dy =
        pointer.y - grabbedBody.y;

    /*
     * Controlled throwing.
     */

    grabbedBody.vx =
        clamp(dx * 0.55,-18,18);

    grabbedBody.vy =
        clamp(dy * 0.55,-18,18);

    grabbedBody.x +=
        dx * 0.75;

    grabbedBody.y +=
        dy * 0.75;
}

function endGrab() {

    pointer.down = false;

    if (grabbedBody) {
        grabbedBody.grabbed = false;
    }

    grabbedBody = null;

    canvas.classList.remove(
        "grabbing"
    );
}

/* =========================================================
   MOUSE
   ========================================================= */

canvas.addEventListener(
    "mousedown",
    beginGrab
);

window.addEventListener(
    "mousemove",
    event => {

        if (pointer.down) {
            moveGrab(event);
        }
    }
);

window.addEventListener(
    "mouseup",
    endGrab
);

/* =========================================================
   TOUCH
   ========================================================= */

canvas.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        beginGrab(event);
    },
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        if (pointer.down) {
            moveGrab(event);
        }
    },
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        endGrab();
    },
    {passive:false}
);

/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            HEIGHT
        );

    gradient.addColorStop(
        0,
        "#11101c"
    );

    gradient.addColorStop(
        1,
        "#08080d"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    ctx.lineWidth = 1;

    for (
        let x = 0;
        x <= WIDTH;
        x += 40
    ) {

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,HEIGHT);
        ctx.stroke();
    }

    for (
        let y = 0;
        y <= HEIGHT;
        y += 40
    ) {

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(WIDTH,y);
        ctx.stroke();
    }

    ctx.fillStyle =
        "#191922";

    ctx.fillRect(
        0,
        FLOOR_Y,
        WIDTH,
        HEIGHT - FLOOR_Y
    );

    ctx.strokeStyle =
        "rgba(167,139,250,.35)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        FLOOR_Y
    );

    ctx.lineTo(
        WIDTH,
        FLOOR_Y
    );

    ctx.stroke();
}

/* =========================================================
   DRAW RAGDOLL
   ========================================================= */

function drawRagdoll() {

    drawPart(
        ragdoll.leftArm,
        "#F5CD30"
    );

    drawPart(
        ragdoll.rightArm,
        "#F5CD30"
    );

    drawPart(
        ragdoll.leftLeg,
        "#A4BD47"
    );

    drawPart(
        ragdoll.rightLeg,
        "#A4BD47"
    );

    drawPart(
        ragdoll.torso,
        "#0D69AC"
    );

    drawHead(
        ragdoll.head
    );
}

/* =========================================================
   DRAW PART
   ========================================================= */

function drawPart(body,color) {

    ctx.save();

    ctx.translate(
        body.x,
        body.y
    );

    ctx.rotate(
        body.angle
    );

    ctx.fillStyle = color;

    ctx.strokeStyle =
        "rgba(0,0,0,.3)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.roundRect(
        -body.width / 2,
        -body.height / 2,
        body.width,
        body.height,
        8
    );

    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   DRAW HEAD
   ========================================================= */

function drawHead(head) {

    ctx.save();

    ctx.translate(
        head.x,
        head.y
    );

    ctx.rotate(
        head.angle
    );

    ctx.fillStyle =
        "#F5CD30";

    ctx.strokeStyle =
        "rgba(0,0,0,.3)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.roundRect(
        -25,
        -25,
        50,
        50,
        9
    );

    ctx.fill();
    ctx.stroke();

    /*
     * Original face.
     */

    ctx.fillStyle =
        "#171717";

    ctx.beginPath();

    ctx.arc(
        -9,
        -4,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        9,
        -4,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#171717";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        9,
        0.15,
        Math.PI - 0.15
    );

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   DRAW OBJECTS
   ========================================================= */

function drawObjects() {

    for (const obj of objects) {

        if (obj.type === "crate") {
            drawCrate(obj);
        }

        if (obj.type === "ball") {
            drawBall(obj);
        }

        if (obj.type === "bomb") {
            drawBomb(obj);
        }
    }
}

function drawCrate(obj) {

    ctx.save();

    ctx.translate(
        obj.x,
        obj.y
    );

    ctx.rotate(
        obj.angle
    );

    ctx.fillStyle =
        "#A66A35";

    ctx.strokeStyle =
        "#5B351A";

    ctx.lineWidth = 3;

    ctx.fillRect(
        -22,
        -22,
        44,
        44
    );

    ctx.strokeRect(
        -22,
        -22,
        44,
        44
    );

    ctx.strokeStyle =
        "rgba(255,220,170,.55)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(-16,-16);
    ctx.lineTo(16,16);

    ctx.moveTo(16,-16);
    ctx.lineTo(-16,16);

    ctx.stroke();

    ctx.restore();
}

function drawBall(obj) {

    ctx.save();

    ctx.translate(
        obj.x,
        obj.y
    );

    ctx.fillStyle =
        "#F4F4F5";

    ctx.strokeStyle =
        "rgba(0,0,0,.4)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle =
        "#777";

    ctx.beginPath();

    ctx.moveTo(-7,-15);
    ctx.lineTo(0,-5);
    ctx.lineTo(9,-12);

    ctx.moveTo(-17,1);
    ctx.lineTo(-5,4);
    ctx.lineTo(-9,15);

    ctx.stroke();

    ctx.restore();
}

function drawBomb(obj) {

    ctx.save();

    ctx.translate(
        obj.x,
        obj.y
    );

    ctx.rotate(
        obj.angle
    );

    ctx.fillStyle =
        "#25252D";

    ctx.strokeStyle =
        "#0A0A0D";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle =
        "#C9C9D1";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(7,-12);

    ctx.quadraticCurveTo(
        14,
        -23,
        10,
        -28
    );

    ctx.stroke();

    if (
        Math.floor(obj.fuse / 5) % 2 === 0
    ) {

        ctx.fillStyle =
            "#FFD43B";

        ctx.beginPath();

        ctx.arc(
            10,
            -29,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   PARTICLES
   ========================================================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.vy += 0.18;

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if (p.life <= 0) {
            particles.splice(i,1);
        }
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life / 40
            );

        ctx.fillStyle =
            "#A78BFA";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* =========================================================
   GAME LOOP
   ========================================================= */

function render() {

    drawBackground();
    drawObjects();
    drawRagdoll();
    drawParticles();
}

function gameLoop() {

    updateRagdoll();
    updateObjects();
    updateParticles();

    render();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

/* =========================================================
   BUTTONS
   ========================================================= */

const spawnButton =
    document.getElementById("spawnButton");

const spawnMenu =
    document.getElementById("spawnMenu");

const crateButton =
    document.getElementById("crateButton");

const ballButton =
    document.getElementById("ballButton");

const bombButton =
    document.getElementById("bombButton");

const boomButton =
    document.getElementById("boomButton");

const resetButton =
    document.getElementById("resetButton");

const clearButton =
    document.getElementById("clearButton");

spawnButton.onclick = () => {
    spawnMenu.classList.toggle("open");
};

crateButton.onclick = () => {
    spawnCrate();
};

ballButton.onclick = () => {
    spawnBall();
};

bombButton.onclick = () => {
    spawnBomb();
};

boomButton.onclick = () => {

    explode(
        ragdoll.torso.x,
        ragdoll.torso.y,
        170
    );
};

resetButton.onclick = () => {

    createRagdoll();
};

clearButton.onclick = () => {

    objects = [];
    particles = [];
};

/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "r" ||
            event.key === "R"
        ) {
            createRagdoll();
        }

        if (
            event.key === "c" ||
            event.key === "C"
        ) {
            spawnCrate();
        }

        if (
            event.key === "b" ||
            event.key === "B"
        ) {
            spawnBall();
        }

        if (
            event.key === "x" ||
            event.key === "X"
        ) {
            spawnBomb();
        }

        if (event.code === "Space") {

            event.preventDefault();

            explode(
                ragdoll.torso.x,
                ragdoll.torso.y,
                170
            );
        }
    }
);

/* =========================================================
   HELPERS
   ========================================================= */

function random(min,max) {
    return Math.random() * (max - min) + min;
}

function clamp(value,min,max) {
    return Math.max(
        min,
        Math.min(max,value)
    );
}

</script>
