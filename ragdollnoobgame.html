<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ragdoll Noob</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #34205f 0%, #171225 45%, #08070d 100%);
            color: white;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .page {
            width: min(1100px, 100%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 24px;
        }

        .brand-text p {
            margin: 3px 0 0;
            color: #aaa3bd;
            font-size: 13px;
        }

        .back-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.07);
            color: white;
            padding: 11px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.13);
            transform: translateY(-1px);
        }

        .game-card {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(16, 13, 28, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .game-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .game-title h2 {
            margin: 0;
            font-size: clamp(28px, 5vw, 46px);
        }

        .game-title p {
            margin: 6px 0 0;
            color: #aaa3bd;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: #0b0a10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            touch-action: none;
            cursor: crosshair;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 14px;
        }

        button {
            min-height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.13);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .primary {
            background: linear-gradient(
                135deg,
                rgba(139, 92, 246, 0.8),
                rgba(99, 55, 180, 0.8)
            );
        }

        .primary:hover {
            background: linear-gradient(
                135deg,
                rgba(155, 110, 255, 0.9),
                rgba(112, 67, 195, 0.9)
            );
        }

        .instructions {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #b8b2c6;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #777183;
            font-size: 12px;
            margin-top: 18px;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            header {
                align-items: flex-start;
            }

            .controls {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-card {
                padding: 12px;
            }

            .brand-text h1 {
                font-size: 20px;
            }

            .back-button {
                padding: 9px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 430px) {
            header {
                flex-direction: column;
            }

            .back-button {
                width: 100%;
                text-align: center;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="brand">
            <img
                class="brand-icon"
                src="images/astraicontransparent.ico"
                alt="Astra"
            >

            <div class="brand-text">
                <h1>Ragdoll Noob</h1>
                <p>An absolutely pointless physics sandbox.</p>
            </div>
        </div>

        <a class="back-button" href="index.html">
            ← Back to Astra
        </a>
    </header>


    <main class="game-card">

        <div class="game-title">
            <h2>RAGDOLL NOOB</h2>
            <p>Throw him around. He doesn't care.</p>
        </div>


        <div class="game-wrapper">
            <canvas
                id="gameCanvas"
                width="960"
                height="540"
            ></canvas>
        </div>


        <div class="controls">
            <button
                id="crateButton"
                class="primary"
                type="button"
            >
                🧱 Spawn Crate
            </button>

            <button
                id="ballButton"
                type="button"
            >
                ⚽ Spawn Ball
            </button>

            <button
                id="boomButton"
                type="button"
            >
                💥 Cartoon BOOM
            </button>

            <button
                id="resetButton"
                type="button"
            >
                🔄 Reset Noob
            </button>
        </div>


        <div class="instructions">
            <strong>How to play:</strong>
            Click or tap the noob to throw him around.
            Spawn objects and cause maximum chaos.
            There is no objective.
            The noob is simply here.
        </div>

    </main>


    <footer>
        Ragdoll Noob · An Astra game
    </footer>

</div>


<script>
(() => {

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const GROUND_Y = HEIGHT - 45;

    let objects = [];
    let particles = [];

    let noob = null;

    let mouse = {
        x: 0,
        y: 0
    };

    let dragging = false;

    let lastTime = performance.now();


    function resetNoob() {

        noob = {
            x: WIDTH / 2,
            y: GROUND_Y - 75,

            vx: 0,
            vy: 0,

            angle: 0,
            angularVelocity: 0,

            ragdoll: false,

            width: 42,
            height: 78
        };

    }


    function spawnCrate() {

        objects.push({
            type: "crate",

            x: WIDTH / 2,
            y: 80,

            size: 38,

            vx: (Math.random() - 0.5) * 4,
            vy: 0,

            rotation: Math.random() * Math.PI,

            vr: (Math.random() - 0.5) * 0.1
        });

    }


    function spawnBall() {

        objects.push({
            type: "ball",

            x: WIDTH / 2,
            y: 80,

            radius: 19,

            vx: (Math.random() - 0.5) * 5,
            vy: 0,

            rotation: 0
        });

    }


    function createExplosion(x, y) {

        for (let i = 0; i < 35; i++) {

            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                Math.random() * 7 + 2;

            particles.push({
                x: x,
                y: y,

                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,

                life: 1,

                size: Math.random() * 7 + 3
            });

        }


        const dx = noob.x - x;
        const dy = noob.y - y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);


        if (distance < 300) {

            const strength =
                (1 - distance / 300) * 22;

            const angle =
                Math.atan2(dy, dx);

            noob.vx += Math.cos(angle) * strength;
            noob.vy += Math.sin(angle) * strength - 8;

            noob.angularVelocity +=
                (Math.random() - 0.5) * 1.2;

            noob.ragdoll = true;
        }

    }


    function cartoonBoom() {

        createExplosion(
            noob.x + (Math.random() - 0.5) * 100,
            noob.y + (Math.random() - 0.5) * 80
        );

    }


    function update(delta) {

        const dt =
            Math.min(delta / 16.67, 2);


        // Noob physics

        noob.vy += 0.65 * dt;

        noob.x += noob.vx * dt;
        noob.y += noob.vy * dt;

        noob.angle +=
            noob.angularVelocity * dt;

        noob.angularVelocity *= 0.995;

        noob.vx *= 0.995;


        if (noob.y + noob.height / 2 > GROUND_Y) {

            noob.y =
                GROUND_Y - noob.height / 2;

            noob.vy *= -0.35;

            noob.vx *= 0.85;

            noob.angularVelocity *= 0.8;

        }


        if (Math.abs(noob.vx) > 0.2 ||
            Math.abs(noob.vy) > 0.2) {

            noob.ragdoll = true;

        }


        // Screen boundaries

        if (noob.x < 25) {
            noob.x = 25;
            noob.vx *= -0.65;
        }

        if (noob.x > WIDTH - 25) {
            noob.x = WIDTH - 25;
            noob.vx *= -0.65;
        }


        // Objects

        for (const object of objects) {

            object.vy += 0.65 * dt;

            object.x += object.vx * dt;
            object.y += object.vy * dt;


            if (object.type === "crate") {

                object.rotation +=
                    object.vr * dt;

                const half =
                    object.size / 2;

                if (object.y + half > GROUND_Y) {

                    object.y =
                        GROUND_Y - half;

                    object.vy *= -0.3;
                    object.vx *= 0.92;
                    object.vr *= 0.9;

                }

            }


            if (object.type === "ball") {

                if (
                    object.y + object.radius >
                    GROUND_Y
                ) {

                    object.y =
                        GROUND_Y - object.radius;

                    object.vy *= -0.65;
                    object.vx *= 0.98;

                }

            }


            // Object / noob collision

            const dx =
                noob.x - object.x;

            const dy =
                noob.y - object.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);


            const collisionDistance =
                object.type === "ball"
                    ? object.radius + 35
                    : object.size / 2 + 38;


            if (distance < collisionDistance) {

                const angle =
                    Math.atan2(dy, dx);

                const force =
                    object.type === "ball"
                        ? 12
                        : 9;


                noob.vx +=
                    Math.cos(angle) * force;

                noob.vy +=
                    Math.sin(angle) * force - 4;

                noob.angularVelocity +=
                    (Math.random() - 0.5) * 0.8;

                noob.ragdoll = true;

            }

        }


        // Remove objects that fall away

        objects =
            objects.filter(object =>
                object.x > -150 &&
                object.x < WIDTH + 150 &&
                object.y < HEIGHT + 200
            );


        // Particles

        for (const particle of particles) {

            particle.x +=
                particle.vx * dt;

            particle.y +=
                particle.vy * dt;

            particle.vy +=
                0.3 * dt;

            particle.life -=
                0.025 * dt;

        }


        particles =
            particles.filter(
                particle => particle.life > 0
            );

    }


    function drawBackground() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );

        gradient.addColorStop(
            0,
            "#151027"
        );

        gradient.addColorStop(
            1,
            "#08080d"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        // Decorative circles

        ctx.globalAlpha = 0.08;

        ctx.fillStyle = "#9b6cff";

        ctx.beginPath();

        ctx.arc(
            150,
            100,
            100,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            820,
            150,
            150,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.globalAlpha = 1;


        // Ground

        ctx.fillStyle =
            "#111019";

        ctx.fillRect(
            0,
            GROUND_Y,
            WIDTH,
            HEIGHT - GROUND_Y
        );


        ctx.fillStyle =
            "#292333";

        ctx.fillRect(
            0,
            GROUND_Y,
            WIDTH,
            3
        );

    }


    function drawNoob() {

        ctx.save();

        ctx.translate(
            noob.x,
            noob.y
        );

        ctx.rotate(
            noob.angle
        );


        // Legs

        ctx.fillStyle =
            "#20242b";

        ctx.fillRect(
            -18,
            25,
            14,
            38
        );

        ctx.fillRect(
            4,
            25,
            14,
            38
        );


        // Torso

        ctx.fillStyle =
            "#3f83e8";

        ctx.fillRect(
            -21,
            -20,
            42,
            50
        );


        // Arms

        ctx.fillStyle =
            "#e5a06c";

        ctx.fillRect(
            -34,
            -17,
            13,
            45
        );

        ctx.fillRect(
            21,
            -17,
            13,
            45
        );


        // Head

        ctx.fillStyle =
            "#f2b27b";

        ctx.fillRect(
            -23,
            -58,
            46,
            38
        );


        // Face

        ctx.fillStyle =
            "#111111";

        ctx.fillRect(
            -13,
            -45,
            6,
            6
        );

        ctx.fillRect(
            7,
            -45,
            6,
            6
        );


        ctx.restore();

    }


    function drawObjects() {

        for (const object of objects) {

            ctx.save();

            ctx.translate(
                object.x,
                object.y
            );


            if (object.type === "crate") {

                ctx.rotate(
                    object.rotation
                );

                ctx.fillStyle =
                    "#9b6a3b";

                ctx.fillRect(
                    -object.size / 2,
                    -object.size / 2,
                    object.size,
                    object.size
                );


                ctx.strokeStyle =
                    "#d49a5c";

                ctx.lineWidth = 4;

                ctx.strokeRect(
                    -object.size / 2,
                    -object.size / 2,
                    object.size,
                    object.size
                );


                ctx.strokeStyle =
                    "#704522";

                ctx.lineWidth = 3;

                ctx.beginPath();

                ctx.moveTo(
                    -object.size / 2,
                    -object.size / 2
                );

                ctx.lineTo(
                    object.size / 2,
                    object.size / 2
                );

                ctx.moveTo(
                    object.size / 2,
                    -object.size / 2
                );

                ctx.lineTo(
                    -object.size / 2,
                    object.size / 2
                );

                ctx.stroke();

            }


            if (object.type === "ball") {

                const gradient =
                    ctx.createRadialGradient(
                        -6,
                        -6,
                        2,
                        0,
                        0,
                        object.radius
                    );

                gradient.addColorStop(
                    0,
                    "#ffffff"
                );

                gradient.addColorStop(
                    1,
                    "#725cff"
                );

                ctx.fillStyle =
                    gradient;

                ctx.beginPath();

                ctx.arc(
                    0,
                    0,
                    object.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            ctx.restore();

        }

    }


    function drawParticles() {

        for (const particle of particles) {

            ctx.globalAlpha =
                particle.life;

            ctx.fillStyle =
                "#ffbd4a";

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        ctx.globalAlpha = 1;

    }


    function draw() {

        drawBackground();

        drawObjects();

        drawNoob();

        drawParticles();


        // Small title

        ctx.fillStyle =
            "rgba(255,255,255,0.55)";

        ctx.font =
            "bold 15px Arial";

        ctx.fillText(
            "RAGDOLL NOOB",
            20,
            30
        );

    }


    function gameLoop(time) {

        const delta =
            time - lastTime;

        lastTime = time;

        update(delta);

        draw();

        requestAnimationFrame(gameLoop);

    }


    function pointerPosition(event) {

        const rect =
            canvas.getBoundingClientRect();

        return {
            x:
                (event.clientX - rect.left) *
                (WIDTH / rect.width),

            y:
                (event.clientY - rect.top) *
                (HEIGHT / rect.height)
        };

    }


    canvas.addEventListener(
        "pointerdown",
        event => {

            const position =
                pointerPosition(event);

            mouse.x = position.x;
            mouse.y = position.y;


            const dx =
                mouse.x - noob.x;

            const dy =
                mouse.y - noob.y;


            if (
                Math.sqrt(
                    dx * dx + dy * dy
                ) < 70
            ) {

                dragging = true;

                noob.ragdoll = true;

                canvas.setPointerCapture(
                    event.pointerId
                );

            }

        }
    );


    canvas.addEventListener(
        "pointermove",
        event => {

            if (!dragging) {
                return;
            }

            const position =
                pointerPosition(event);

            mouse.x = position.x;
            mouse.y = position.y;

            noob.vx =
                (mouse.x - noob.x) * 0.25;

            noob.vy =
                (mouse.y - noob.y) * 0.25;

            noob.x = mouse.x;
            noob.y = mouse.y;

        }
    );


    canvas.addEventListener(
        "pointerup",
        event => {

            if (!dragging) {
                return;
            }

            dragging = false;

            try {
                canvas.releasePointerCapture(
                    event.pointerId
                );
            } catch {}

            noob.vx *= 1.8;
            noob.vy *= 1.8;

        }
    );


    document
        .getElementById("crateButton")
        .addEventListener(
            "click",
            spawnCrate
        );


    document
        .getElementById("ballButton")
        .addEventListener(
            "click",
            spawnBall
        );


    document
        .getElementById("boomButton")
        .addEventListener(
            "click",
            cartoonBoom
        );


    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            resetNoob
        );


    // Keyboard shortcuts

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.target.tagName === "INPUT" ||
                event.target.tagName === "TEXTAREA"
            ) {
                return;
            }


            if (event.key.toLowerCase() === "r") {
                resetNoob();
            }


            if (event.key.toLowerCase() === "c") {
                spawnCrate();
            }


            if (event.key.toLowerCase() === "b") {
                spawnBall();
            }


            if (event.key === " ") {

                event.preventDefault();

                cartoonBoom();

            }

        }
    );


    resetNoob();

    requestAnimationFrame(gameLoop);

})();
</script>

</body>
</html>
