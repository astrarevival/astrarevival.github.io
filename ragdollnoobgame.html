<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ragdoll Noob</title>

    <link rel="icon" href="images/astraicontransparent.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #34205f 0%,
                    #171225 45%,
                    #08070d 100%
                );
            color: white;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .page {
            width: min(1100px, 100%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 24px;
        }

        .brand-text p {
            margin: 3px 0 0;
            color: #aaa3bd;
            font-size: 13px;
        }

        .back-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.07);
            color: white;
            padding: 11px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.13);
            transform: translateY(-1px);
        }

        .game-card {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(16, 13, 28, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .game-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .game-title h2 {
            margin: 0;
            font-size: clamp(28px, 5vw, 46px);
        }

        .game-title p {
            margin: 6px 0 0;
            color: #aaa3bd;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: #0b0a10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            touch-action: none;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            min-height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: white;
            padding: 0 17px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.13);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .primary {
            background:
                linear-gradient(
                    135deg,
                    rgba(139, 92, 246, 0.8),
                    rgba(99, 55, 180, 0.8)
                );
        }

        .primary:hover {
            background:
                linear-gradient(
                    135deg,
                    rgba(155, 110, 255, 0.9),
                    rgba(112, 67, 195, 0.9)
                );
        }

        .danger {
            background:
                linear-gradient(
                    135deg,
                    rgba(210, 65, 85, 0.65),
                    rgba(150, 40, 70, 0.65)
                );
        }

        /* Spawn menu */

        .spawn-area {
            position: relative;
            display: inline-block;
        }

        .spawn-menu {
            position: absolute;
            left: 0;
            bottom: calc(100% + 8px);
            width: 230px;

            display: none;

            padding: 10px;

            background: rgba(20, 16, 34, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            z-index: 20;
        }

        .spawn-menu.open {
            display: block;
        }

        .spawn-menu-title {
            color: #aaa3bd;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 5px 8px 9px;
        }

        .spawn-option {
            width: 100%;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            margin: 4px 0;
            padding: 0 12px;

            background: rgba(255, 255, 255, 0.05);
        }

        .spawn-option:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        .instructions {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #b8b2c6;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #777183;
            font-size: 12px;
            margin-top: 18px;
        }

        @media (max-width: 700px) {

            body {
                padding: 12px;
            }

            header {
                align-items: flex-start;
            }

            .game-card {
                padding: 12px;
            }

            .brand-text h1 {
                font-size: 20px;
            }

            .back-button {
                padding: 9px 12px;
                font-size: 13px;
            }

            .controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .controls > button,
            .spawn-area {
                width: 100%;
            }

            .spawn-area > button {
                width: 100%;
            }

            .spawn-menu {
                width: 100%;
            }
        }

        @media (max-width: 430px) {

            header {
                flex-direction: column;
            }

            .back-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>

        <div class="brand">

            <img
                class="brand-icon"
                src="images/astraicontransparent.ico"
                alt="Astra"
            >

            <div class="brand-text">
                <h1>Ragdoll Noob</h1>
                <p>An absolutely pointless physics sandbox.</p>
            </div>

        </div>

        <a
            class="back-button"
            href="index.html"
        >
            ← Back to Astra
        </a>

    </header>


    <main class="game-card">

        <div class="game-title">

            <h2>RAGDOLL NOOB</h2>

            <p>
                Throw him around. He doesn't care.
            </p>

        </div>


        <div class="game-wrapper">

            <canvas
                id="gameCanvas"
                width="960"
                height="540"
            ></canvas>

        </div>


        <div class="controls">

            <div class="spawn-area">

                <button
                    id="spawnButton"
                    class="primary"
                    type="button"
                >
                    ➕ Spawn
                </button>


                <div
                    id="spawnMenu"
                    class="spawn-menu"
                >

                    <div class="spawn-menu-title">
                        Spawn object
                    </div>


                    <button
                        class="spawn-option"
                        data-spawn="crate"
                        type="button"
                    >
                        🧱 Crate
                    </button>


                    <button
                        class="spawn-option"
                        data-spawn="ball"
                        type="button"
                    >
                        ⚽ Ball
                    </button>


                    <button
                        class="spawn-option"
                        data-spawn="bomb"
                        type="button"
                    >
                        💣 Cartoon Bomb
                    </button>

                </div>

            </div>


            <button
                id="boomButton"
                type="button"
            >
                💥 Cartoon BOOM
            </button>


            <button
                id="resetButton"
                type="button"
            >
                🔄 Reset Noob
            </button>


            <button
                id="clearButton"
                class="danger"
                type="button"
            >
                🗑️ Clear Objects
            </button>

        </div>


        <div class="instructions">

            <strong>How to play:</strong>
            Grab the Noob or any object and throw it around.
            Use <strong>Spawn</strong> to add things.
            The Noob has absolutely no objective.

        </div>

    </main>


    <footer>
        Ragdoll Noob · An Astra game
    </footer>

</div>


<script>
(() => {

    const canvas =
        document.getElementById("gameCanvas");

    const ctx =
        canvas.getContext("2d");


    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const GROUND_Y =
        HEIGHT - 45;


    /*
        ================================================
        COLORS
        ================================================
    */

    const COLORS = {

        yellow: "#F5CD30",

        blue: "#0D69AC",

        green: "#A4BD47",

        black: "#111111",

        crate: "#9B6A3B",

        crateLight: "#D49A5C",

        crateDark: "#704522"

    };


    /*
        ================================================
        PHYSICS
        ================================================
    */

    const GRAVITY = 0.62;

    const AIR_FRICTION = 0.995;

    const GROUND_FRICTION = 0.84;


    let bodies = [];

    let joints = [];

    let objects = [];

    let particles = [];


    let grabbed = null;

    let grabOffsetX = 0;

    let grabOffsetY = 0;

    let lastPointer = null;


    let lastTime =
        performance.now();


    /*
        ================================================
        BODY
        ================================================
    */

    function createBody(
        name,
        x,
        y,
        width,
        height,
        color,
        mass
    ) {

        return {

            type: "body",

            name,

            x,

            y,

            width,

            height,

            color,

            mass,

            vx: 0,

            vy: 0,

            angle: 0,

            angularVelocity: 0

        };

    }


    /*
        ================================================
        NOOB
        ================================================
    */

    function createNoob() {

        bodies = [];

        joints = [];


        const x =
            WIDTH / 2;


        const torso =
            createBody(
                "torso",
                x,
                GROUND_Y - 112,
                50,
                58,
                COLORS.blue,
                2
            );


        const head =
            createBody(
                "head",
                x,
                GROUND_Y - 164,
                46,
                42,
                COLORS.yellow,
                1
            );


        const leftArm =
            createBody(
                "leftArm",
                x - 40,
                GROUND_Y - 105,
                16,
                58,
                COLORS.yellow,
                0.8
            );


        const rightArm =
            createBody(
                "rightArm",
                x + 40,
                GROUND_Y - 105,
                16,
                58,
                COLORS.yellow,
                0.8
            );


        const leftLeg =
            createBody(
                "leftLeg",
                x - 14,
                GROUND_Y - 48,
                20,
                56,
                COLORS.green,
                1
            );


        const rightLeg =
            createBody(
                "rightLeg",
                x + 14,
                GROUND_Y - 48,
                20,
                56,
                COLORS.green,
                1
            );


        bodies.push(
            torso,
            head,
            leftArm,
            rightArm,
            leftLeg,
            rightLeg
        );


        joints.push(

            {
                a: torso,
                b: head,
                ax: 0,
                ay: -29,
                bx: 0,
                by: 21,
                strength: 0.72
            },

            {
                a: torso,
                b: leftArm,
                ax: -25,
                ay: -20,
                bx: 0,
                by: -25,
                strength: 0.42
            },

            {
                a: torso,
                b: rightArm,
                ax: 25,
                ay: -20,
                bx: 0,
                by: -25,
                strength: 0.42
            },

            {
                a: torso,
                b: leftLeg,
                ax: -13,
                ay: 29,
                bx: 0,
                by: -28,
                strength: 0.62
            },

            {
                a: torso,
                b: rightLeg,
                ax: 13,
                ay: 29,
                bx: 0,
                by: -28,
                strength: 0.62
            }

        );

    }


    /*
        ================================================
        RESET
        ================================================
    */

    function resetNoob() {

        createNoob();

    }


    /*
        ================================================
        SPAWN CRATE
        ================================================
    */

    function spawnCrate() {

        objects.push({

            type: "crate",

            x: WIDTH / 2,

            y: 70,

            size: 42,

            vx:
                (Math.random() - 0.5) * 6,

            vy: 0,

            rotation:
                Math.random() * Math.PI,

            vr:
                (Math.random() - 0.5) * 0.16,

            mass: 2

        });

    }


    /*
        ================================================
        SPAWN BALL
        ================================================
    */

    function spawnBall() {

        objects.push({

            type: "ball",

            x: WIDTH / 2,

            y: 70,

            radius: 20,

            vx:
                (Math.random() - 0.5) * 7,

            vy: 0,

            rotation: 0,

            mass: 1

        });

    }


    /*
        ================================================
        SPAWN CARTOON BOMB
        ================================================
    */

    function spawnBomb() {

        objects.push({

            type: "bomb",

            x: WIDTH / 2,

            y: 70,

            radius: 19,

            vx:
                (Math.random() - 0.5) * 5,

            vy: 0,

            rotation: 0,

            mass: 1.5,

            fuse: 0,

            exploded: false

        });

    }


    /*
        ================================================
        EXPLOSION
        ================================================
    */

    function explode(x, y) {

        for (
            let i = 0;
            i < 48;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI *
                2;


            const speed =
                Math.random() * 8 + 2;


            particles.push({

                x,

                y,

                vx:
                    Math.cos(angle) * speed,

                vy:
                    Math.sin(angle) * speed,

                life: 1,

                size:
                    Math.random() * 7 + 3

            });

        }


        /*
            Push Noob
        */

        for (const body of bodies) {

            const dx =
                body.x - x;

            const dy =
                body.y - y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance < 330) {

                const strength =
                    (1 - distance / 330) *
                    26;


                const angle =
                    Math.atan2(dy, dx);


                body.vx +=
                    Math.cos(angle) *
                    strength /
                    body.mass;


                body.vy +=
                    Math.sin(angle) *
                    strength /
                    body.mass -
                    7;


                body.angularVelocity +=
                    (Math.random() - 0.5) *
                    2;

            }

        }


        /*
            Push spawned objects
        */

        for (const object of objects) {

            const dx =
                object.x - x;

            const dy =
                object.y - y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance < 330 &&
                distance > 0
            ) {

                const strength =
                    (1 - distance / 330) *
                    25;


                const angle =
                    Math.atan2(dy, dx);


                object.vx +=
                    Math.cos(angle) *
                    strength /
                    object.mass;


                object.vy +=
                    Math.sin(angle) *
                    strength /
                    object.mass -
                    5;

            }

        }

    }


    function cartoonBoom() {

        const torso =
            bodies.find(
                body =>
                    body.name === "torso"
            );


        if (!torso) {
            return;
        }


        explode(

            torso.x +
                (Math.random() - 0.5) * 100,

            torso.y +
                (Math.random() - 0.5) * 80

        );

    }


    /*
        ================================================
        UPDATE JOINTS
        ================================================
    */

    function solveJoints() {

        for (const joint of joints) {

            const a =
                joint.a;

            const b =
                joint.b;


            const targetX =
                a.x +
                joint.ax;


            const targetY =
                a.y +
                joint.ay;


            const bx =
                b.x +
                joint.bx;


            const by =
                b.y +
                joint.by;


            const dx =
                targetX - bx;

            const dy =
                targetY - by;


            b.x +=
                dx *
                joint.strength;

            b.y +=
                dy *
                joint.strength;


            a.vx +=
                dx *
                0.008;

            a.vy +=
                dy *
                0.008;


            b.vx +=
                dx *
                0.012;

            b.vy +=
                dy *
                0.012;

        }

    }


    /*
        ================================================
        BODY PHYSICS
        ================================================
    */

    function updateBodies(dt) {

        for (const body of bodies) {

            body.vy +=
                GRAVITY * dt;


            body.x +=
                body.vx * dt;

            body.y +=
                body.vy * dt;


            body.angle +=
                body.angularVelocity * dt;


            body.vx *=
                AIR_FRICTION;

            body.angularVelocity *=
                0.992;


            /*
                Ground collision
            */

            const bottom =
                body.y +
                body.height / 2;


            if (bottom > GROUND_Y) {

                body.y =
                    GROUND_Y -
                    body.height / 2;


                body.vy *=
                    -0.32;


                body.vx *=
                    GROUND_FRICTION;


                body.angularVelocity *=
                    0.82;

            }


            /*
                Side walls
            */

            const halfWidth =
                body.width / 2;


            if (
                body.x - halfWidth <
                0
            ) {

                body.x =
                    halfWidth;

                body.vx *=
                    -0.6;

            }


            if (
                body.x + halfWidth >
                WIDTH
            ) {

                body.x =
                    WIDTH -
                    halfWidth;

                body.vx *=
                    -0.6;

            }

        }


        /*
            Solve joints several times
            to keep the ragdoll together.
        */

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            solveJoints();

        }

    }


    /*
        ================================================
        OBJECT PHYSICS
        ================================================
    */

    function updateObjects(dt) {

        for (const object of objects) {

            object.vy +=
                GRAVITY * dt;


            object.x +=
                object.vx * dt;

            object.y +=
                object.vy * dt;


            object.vx *=
                AIR_FRICTION;


            /*
                Crate
            */

            if (
                object.type === "crate"
            ) {

                object.rotation +=
                    object.vr * dt;


                const half =
                    object.size / 2;


                if (
                    object.y + half >
                    GROUND_Y
                ) {

                    object.y =
                        GROUND_Y - half;

                    object.vy *=
                        -0.38;

                    object.vx *=
                        GROUND_FRICTION;

                    object.vr *=
                        0.88;

                }

            }


            /*
                Ball
            */

            if (
                object.type === "ball"
            ) {

                if (
                    object.y +
                    object.radius >
                    GROUND_Y
                ) {

                    object.y =
                        GROUND_Y -
                        object.radius;

                    object.vy *=
                        -0.68;

                    object.vx *=
                        0.98;

                }

            }


            /*
                Bomb
            */

            if (
                object.type === "bomb"
            ) {

                if (
                    object.y +
                    object.radius >
                    GROUND_Y
                ) {

                    object.y =
                        GROUND_Y -
                        object.radius;

                    object.vy *=
                        -0.42;

                    object.vx *=
                        0.9;

                }

                /*
                    Bombs automatically pop
                    after being around for
                    a while.
                */

                object.fuse +=
                    dt;


                if (
                    object.fuse > 260 &&
                    !object.exploded
                ) {

                    object.exploded = true;

                    explode(
                        object.x,
                        object.y
                    );

                }

            }


            /*
                Object / Noob collision
            */

            for (const body of bodies) {

                const dx =
                    body.x -
                    object.x;

                const dy =
                    body.y -
                    object.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                let collisionDistance;


                if (
                    object.type === "ball" ||
                    object.type === "bomb"
                ) {

                    collisionDistance =
                        object.radius +
                        Math.max(
                            body.width,
                            body.height
                        ) *
                        0.42;

                } else {

                    collisionDistance =
                        object.size / 2 +
                        Math.max(
                            body.width,
                            body.height
                        ) *
                        0.42;

                }


                if (
                    distance <
                    collisionDistance &&
                    distance > 0
                ) {

                    const angle =
                        Math.atan2(
                            dy,
                            dx
                        );


                    const force =
                        object.type === "bomb"
                            ? 8
                            : 5;


                    body.vx +=
                        Math.cos(angle) *
                        force /
                        body.mass;


                    body.vy +=
                        Math.sin(angle) *
                        force /
                        body.mass -
                        2;


                    body.angularVelocity +=
                        (Math.random() - 0.5) *
                        0.9;


                    /*
                        Bomb touching the Noob
                        causes a cartoon explosion.
                    */

                    if (
                        object.type === "bomb" &&
                        !object.exploded
                    ) {

                        object.exploded = true;

                        explode(
                            object.x,
                            object.y
                        );

                    }

                }

            }

        }


        /*
            Remove exploded bombs
        */

        objects =
            objects.filter(
                object =>
                    !(
                        object.type === "bomb" &&
                        object.exploded
                    ) &&
                    object.x > -180 &&
                    object.x < WIDTH + 180 &&
                    object.y < HEIGHT + 250
            );

    }


    /*
        ================================================
        PARTICLES
        ================================================
    */

    function updateParticles(dt) {

        for (const particle of particles) {

            particle.x +=
                particle.vx * dt;

            particle.y +=
                particle.vy * dt;


            particle.vy +=
                0.32 * dt;


            particle.life -=
                0.025 * dt;

        }


        particles =
            particles.filter(
                particle =>
                    particle.life > 0
            );

    }


    /*
        ================================================
        UPDATE
        ================================================
    */

    function update(delta) {

        const dt =
            Math.min(
                delta / 16.67,
                2
            );


        updateBodies(dt);

        updateObjects(dt);

        updateParticles(dt);

    }


    /*
        ================================================
        DRAW BACKGROUND
        ================================================
    */

    function drawBackground() {

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                HEIGHT
            );


        gradient.addColorStop(
            0,
            "#151027"
        );


        gradient.addColorStop(
            1,
            "#08080D"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
            Purple decorative glow
        */

        ctx.globalAlpha =
            0.08;


        ctx.fillStyle =
            "#9B6CFF";


        ctx.beginPath();

        ctx.arc(
            150,
            100,
            100,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            820,
            150,
            150,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.globalAlpha =
            1;


        /*
            Ground
        */

        ctx.fillStyle =
            "#111019";


        ctx.fillRect(
            0,
            GROUND_Y,
            WIDTH,
            HEIGHT - GROUND_Y
        );


        ctx.fillStyle =
            "#292333";


        ctx.fillRect(
            0,
            GROUND_Y,
            WIDTH,
            3
        );

    }


    /*
        ================================================
        DRAW BODY
        ================================================
    */

    function drawBody(body) {

        ctx.save();


        ctx.translate(
            body.x,
            body.y
        );


        ctx.rotate(
            body.angle
        );


        ctx.fillStyle =
            body.color;


        ctx.fillRect(
            -body.width / 2,
            -body.height / 2,
            body.width,
            body.height
        );


        /*
            Head gets an original face.
        */

        if (
            body.name === "head"
        ) {

            ctx.fillStyle =
                COLORS.black;


            /*
                Eyes
            */

            ctx.fillRect(
                -13,
                -5,
                6,
                6
            );


            ctx.fillRect(
                7,
                -5,
                6,
                6
            );


            /*
                Simple original smile
            */

            ctx.strokeStyle =
                COLORS.black;


            ctx.lineWidth =
                3;


            ctx.beginPath();

            ctx.arc(
                0,
                5,
                8,
                0.2,
                Math.PI - 0.2
            );

            ctx.stroke();

        }


        ctx.restore();

    }


    /*
        ================================================
        DRAW OBJECTS
        ================================================
    */

    function drawObjects() {

        for (const object of objects) {

            ctx.save();


            ctx.translate(
                object.x,
                object.y
            );


            /*
                CRATE
            */

            if (
                object.type === "crate"
            ) {

                ctx.rotate(
                    object.rotation
                );


                ctx.fillStyle =
                    COLORS.crate;


                ctx.fillRect(
                    -object.size / 2,
                    -object.size / 2,
                    object.size,
                    object.size
                );


                ctx.strokeStyle =
                    COLORS.crateLight;


                ctx.lineWidth =
                    4;


                ctx.strokeRect(
                    -object.size / 2,
                    -object.size / 2,
                    object.size,
                    object.size
                );


                ctx.strokeStyle =
                    COLORS.crateDark;


                ctx.lineWidth =
                    3;


                ctx.beginPath();


                ctx.moveTo(
                    -object.size / 2,
                    -object.size / 2
                );


                ctx.lineTo(
                    object.size / 2,
                    object.size / 2
                );


                ctx.moveTo(
                    object.size / 2,
                    -object.size / 2
                );


                ctx.lineTo(
                    -object.size / 2,
                    object.size / 2
                );


                ctx.stroke();

            }


            /*
                BALL
            */

            if (
                object.type === "ball"
            ) {

                const gradient =
                    ctx.createRadialGradient(
                        -7,
                        -7,
                        2,
                        0,
                        0,
                        object.radius
                    );


                gradient.addColorStop(
                    0,
                    "#FFFFFF"
                );


                gradient.addColorStop(
                    1,
                    "#725CFF"
                );


                ctx.fillStyle =
                    gradient;


                ctx.beginPath();


                ctx.arc(
                    0,
                    0,
                    object.radius,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            }


            /*
                CARTOON BOMB
            */

            if (
                object.type === "bomb"
            ) {

                /*
                    Bomb body
                */

                ctx.fillStyle =
                    "#17171D";


                ctx.beginPath();


                ctx.arc(
                    0,
                    3,
                    object.radius,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                /*
                    Highlight
                */

                ctx.fillStyle =
                    "#363642";


                ctx.beginPath();


                ctx.arc(
                    -6,
                    -4,
                    5,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                /*
                    Fuse
                */

                ctx.strokeStyle =
                    "#B98248";


                ctx.lineWidth =
                    4;


                ctx.beginPath();


                ctx.moveTo(
                    4,
                    -15
                );


                ctx.quadraticCurveTo(
                    8,
                    -28,
                    17,
                    -25
                );


                ctx.stroke();


                /*
                    Tiny spark
                */

                ctx.fillStyle =
                    "#FFBD4A";


                ctx.beginPath();


                ctx.arc(
                    17,
                    -25,
                    4,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            }


            ctx.restore();

        }

    }


    /*
        ================================================
        DRAW PARTICLES
        ================================================
    */

    function drawParticles() {

        for (const particle of particles) {

            ctx.globalAlpha =
                particle.life;


            ctx.fillStyle =
                "#FFBD4A";


            ctx.beginPath();


            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        ctx.globalAlpha =
            1;

    }


    /*
        ================================================
        DRAW
        ================================================
    */

    function draw() {

        drawBackground();

        drawObjects();


        /*
            Draw Noob
        */

        for (const body of bodies) {

            drawBody(body);

        }


        drawParticles();


        /*
            Canvas title
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.55)";


        ctx.font =
            "bold 15px Arial";


        ctx.fillText(
            "RAGDOLL NOOB",
            20,
            30
        );

    }


    /*
        ================================================
        POINTER POSITION
        ================================================
    */

    function pointerPosition(event) {

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                (event.clientX - rect.left) *
                (WIDTH / rect.width),

            y:
                (event.clientY - rect.top) *
                (HEIGHT / rect.height)

        };

    }


    /*
        ================================================
        FIND OBJECT UNDER POINTER
        ================================================
    */

    function findThingAt(x, y) {

        /*
            Check Noob parts first
        */

        for (
            let i = bodies.length - 1;
            i >= 0;
            i--
        ) {

            const body =
                bodies[i];


            if (
                x >
                body.x -
                body.width / 2 - 8 &&

                x <
                body.x +
                body.width / 2 + 8 &&

                y >
                body.y -
                body.height / 2 - 8 &&

                y <
                body.y +
                body.height / 2 + 8
            ) {

                return body;

            }

        }


        /*
            Then spawned objects
        */

        for (
            let i = objects.length - 1;
            i >= 0;
            i--
        ) {

            const object =
                objects[i];


            const radius =
                object.type === "crate"
                    ? object.size / 2
                    : object.radius;


            const dx =
                x - object.x;

            const dy =
                y - object.y;


            if (
                Math.sqrt(
                    dx * dx +
                    dy * dy
                ) < radius + 8
            ) {

                return object;

            }

        }


        return null;

    }


    /*
        ================================================
        GRAB
        ================================================
    */

    canvas.addEventListener(
        "pointerdown",
        event => {

            const position =
                pointerPosition(event);


            const thing =
                findThingAt(
                    position.x,
                    position.y
                );


            if (!thing) {
                return;
            }


            grabbed =
                thing;


            grabOffsetX =
                position.x -
                thing.x;


            grabOffsetY =
                position.y -
                thing.y;


            lastPointer = {
                x: position.x,
                y: position.y
            };


            canvas.setPointerCapture(
                event.pointerId
            );

        }
    );


    /*
        ================================================
        DRAG
        ================================================
    */

    canvas.addEventListener(
        "pointermove",
        event => {

            if (!grabbed) {
                return;
            }


            const position =
                pointerPosition(event);


            const velocityX =
                position.x -
                lastPointer.x;


            const velocityY =
                position.y -
                lastPointer.y;


            grabbed.x =
                position.x -
                grabOffsetX;


            grabbed.y =
                position.y -
                grabOffsetY;


            grabbed.vx =
                velocityX;


            grabbed.vy =
                velocityY;


            lastPointer = {
                x: position.x,
                y: position.y
            };

        }
    );


    /*
        ================================================
        RELEASE
        ================================================
    */

    canvas.addEventListener(
        "pointerup",
        event => {

            if (!grabbed) {
                return;
            }


            grabbed.vx *=
                1.8;


            grabbed.vy *=
                1.8;


            grabbed =
                null;


            lastPointer =
                null;


            try {

                canvas.releasePointerCapture(
                    event.pointerId
                );

            } catch {}

        }
    );


    canvas.addEventListener(
        "pointercancel",
        () => {

            grabbed =
                null;

            lastPointer =
                null;

        }
    );


    /*
        ================================================
        SPAWN MENU
        ================================================
    */

    const spawnButton =
        document.getElementById(
            "spawnButton"
        );


    const spawnMenu =
        document.getElementById(
            "spawnMenu"
        );


    spawnButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            spawnMenu.classList.toggle(
                "open"
            );

        }
    );


    document.addEventListener(
        "click",
        event => {

            if (
                !event.target.closest(
                    ".spawn-area"
                )
            ) {

                spawnMenu.classList.remove(
                    "open"
                );

            }

        }
    );


    /*
        Spawn options
    */

    document.querySelectorAll(
        ".spawn-option"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const type =
                        button.dataset.spawn;


                    if (
                        type === "crate"
                    ) {

                        spawnCrate();

                    }


                    if (
                        type === "ball"
                    ) {

                        spawnBall();

                    }


                    if (
                        type === "bomb"
                    ) {

                        spawnBomb();

                    }


                    spawnMenu.classList.remove(
                        "open"
                    );

                }
            );

        }
    );


    /*
        ================================================
        BUTTONS
        ================================================
    */

    document
        .getElementById("boomButton")
        .addEventListener(
            "click",
            cartoonBoom
        );


    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            resetNoob
        );


    document
        .getElementById("clearButton")
        .addEventListener(
            "click",
            () => {

                objects = [];

                particles = [];

            }
        );


    /*
        ================================================
        KEYBOARD
        ================================================
    */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.target.tagName === "INPUT" ||
                event.target.tagName === "TEXTAREA"
            ) {

                return;

            }


            const key =
                event.key.toLowerCase();


            if (key === "r") {

                resetNoob();

            }


            if (key === "c") {

                spawnCrate();

            }


            if (key === "b") {

                spawnBall();

            }


            if (key === "x") {

                spawnBomb();

            }


            if (event.key === " ") {

                event.preventDefault();

                cartoonBoom();

            }

        }
    );


    /*
        ================================================
        GAME LOOP
        ================================================
    */

    function gameLoop(time) {

        const delta =
            time - lastTime;


        lastTime =
            time;


        update(delta);

        draw();


        requestAnimationFrame(
            gameLoop
        );

    }


    /*
        START
        ================================================
    */

    resetNoob();

    requestAnimationFrame(
        gameLoop
    );

})();
</script>

</body>
</html>
