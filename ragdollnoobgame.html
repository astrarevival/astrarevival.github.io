<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragdoll Noob</title>
<link rel="icon" href="images/astraicontransparent.ico">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.28), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(99, 102, 241, 0.20), transparent 35%),
        linear-gradient(135deg, #090612, #160c2b 50%, #090612);
    color: white;
}

body {
    min-height: 100vh;
    padding: 18px;
    overflow-x: hidden;
}

.topbar {
    width: min(1200px, 100%);
    margin: 0 auto 18px;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.25);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 19px;
}

.brand img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

.back {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.07);
    color: white;
    padding: 9px 14px;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 700;
}

.back:hover {
    background: rgba(255,255,255,0.12);
}

.wrapper {
    width: min(1200px, 100%);
    margin: auto;
}

.game-card {
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 24px;
    background: rgba(255,255,255,0.055);
    backdrop-filter: blur(20px);
    padding: 20px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.30);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 16px;
}

.title-area h1 {
    margin: 0;
    font-size: clamp(25px, 4vw, 38px);
}

.title-area p {
    margin: 5px 0 0;
    color: rgba(255,255,255,0.55);
    font-size: 14px;
}

.status {
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(139,92,246,0.14);
    border: 1px solid rgba(139,92,246,0.28);
    color: #c4b5fd;
    font-size: 13px;
    white-space: nowrap;
}

.canvas-wrap {
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.10);
    background: #08080c;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    cursor: grab;
    touch-action: none;
}

canvas.grabbing {
    cursor: grabbing;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

button {
    font: inherit;
}

.control-btn {
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.065);
    color: white;
    padding: 11px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.15s ease;
}

.control-btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.11);
}

.control-btn:active {
    transform: translateY(1px);
}

.spawn-menu {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(0,0,0,0.20);
    border: 1px solid rgba(255,255,255,0.08);
}

.spawn-menu.open {
    display: flex;
}

.instructions {
    margin-top: 15px;
    padding: 13px 15px;
    border-radius: 14px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.62);
    font-size: 13px;
    line-height: 1.6;
}

.footer {
    text-align: center;
    color: rgba(255,255,255,0.38);
    font-size: 12px;
    margin-top: 18px;
}

@media (max-width: 650px) {
    body {
        padding: 10px;
    }

    .game-card {
        padding: 12px;
        border-radius: 18px;
    }

    .header {
        align-items: flex-start;
    }

    .status {
        font-size: 11px;
    }

    .control-btn {
        flex: 1 1 calc(50% - 8px);
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="brand">
        <img src="images/astraicontransparent.ico" alt="Astra">
        <span>Astra</span>
    </div>

    <button class="back" onclick="location.href='index.html'">
        ← Back
    </button>
</div>

<main class="wrapper">
    <section class="game-card">

        <div class="header">
            <div class="title-area">
                <h1>Ragdoll Noob</h1>
                <p>Throw him around. There is absolutely no objective.</p>
            </div>

            <div class="status">
                Physics Sandbox
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
        </div>

        <div class="controls">
            <button class="control-btn" id="spawnButton">
                ➕ Spawn
            </button>

            <button class="control-btn" id="boomButton">
                💥 Cartoon BOOM
            </button>

            <button class="control-btn" id="resetButton">
                🔄 Reset Noob
            </button>

            <button class="control-btn" id="clearButton">
                🗑️ Clear Objects
            </button>
        </div>

        <div class="spawn-menu" id="spawnMenu">
            <button class="control-btn" id="crateButton">
                🧱 Crate
            </button>

            <button class="control-btn" id="ballButton">
                ⚽ Ball
            </button>

            <button class="control-btn" id="bombButton">
                💣 Cartoon Bomb
            </button>
        </div>

        <div class="instructions">
            <strong>Controls:</strong>
            Grab the Noob or objects and throw them around.
            Use <strong>R</strong> to reset,
            <strong>C</strong> for a crate,
            <strong>B</strong> for a ball,
            <strong>X</strong> for a cartoon bomb,
            and <strong>Space</strong> for BOOM.
        </div>

    </section>

    <div class="footer">
        Ragdoll Noob · An Astra game
    </div>
</main>

<script>
/* =========================================================
   RAGDOLL NOOB
   Completely silent physics sandbox
   ========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

/* ---------------------------------------------------------
   PHYSICS
   IMPORTANT:
   Canvas Y goes DOWN.
   Therefore gravity MUST be positive.
   --------------------------------------------------------- */

const GRAVITY = 0.42;
const AIR_DRAG = 0.995;
const FLOOR_FRICTION = 0.82;
const BOUNCE = 0.18;

const FLOOR_Y = HEIGHT - 35;

/* ---------------------------------------------------------
   Utility
   --------------------------------------------------------- */

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function distance(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function random(min, max) {
    return Math.random() * (max - min) + min;
}

/* ---------------------------------------------------------
   Physics body
   --------------------------------------------------------- */

class Body {
    constructor(x, y, radius, options = {}) {
        this.x = x;
        this.y = y;

        this.vx = options.vx || 0;
        this.vy = options.vy || 0;

        this.radius = radius;

        this.mass = options.mass || 1;

        this.restitution =
            options.restitution !== undefined
                ? options.restitution
                : BOUNCE;

        this.friction =
            options.friction !== undefined
                ? options.friction
                : FLOOR_FRICTION;

        this.static = options.static || false;

        this.type = options.type || "body";

        this.width = options.width || radius * 2;
        this.height = options.height || radius * 2;

        this.angle = options.angle || 0;
        this.angularVelocity = options.angularVelocity || 0;

        this.grabbed = false;
    }

    integrate() {
        if (this.static) return;

        /*
         * DOWNWARD GRAVITY.
         * This is the important fix.
         */
        this.vy += GRAVITY;

        this.vx *= AIR_DRAG;
        this.vy *= AIR_DRAG;

        this.x += this.vx;
        this.y += this.vy;

        this.angle += this.angularVelocity;
        this.angularVelocity *= 0.995;
    }

    floorCollision() {
        if (this.static) return;

        const bottom = this.y + this.height / 2;

        if (bottom > FLOOR_Y) {
            this.y = FLOOR_Y - this.height / 2;

            if (this.vy > 0) {
                this.vy *= -this.restitution;
            }

            this.vx *= this.friction;

            if (Math.abs(this.vy) < 0.25) {
                this.vy = 0;
            }

            if (Math.abs(this.vx) < 0.02) {
                this.vx = 0;
            }
        }

        const left = this.x - this.width / 2;
        const right = this.x + this.width / 2;

        if (left < 0) {
            this.x = this.width / 2;

            if (this.vx < 0) {
                this.vx *= -this.restitution;
            }
        }

        if (right > WIDTH) {
            this.x = WIDTH - this.width / 2;

            if (this.vx > 0) {
                this.vx *= -this.restitution;
            }
        }
    }
}

/* ---------------------------------------------------------
   Ragdoll parts
   --------------------------------------------------------- */

let ragdoll = {
    head: null,
    torso: null,
    leftArm: null,
    rightArm: null,
    leftLeg: null,
    rightLeg: null
};

function createRagdoll() {

    ragdoll.head = new Body(
        480,
        150,
        25,
        {
            width: 50,
            height: 50,
            mass: 1,
            type: "head",
            restitution: 0.12
        }
    );

    ragdoll.torso = new Body(
        480,
        215,
        26,
        {
            width: 52,
            height: 65,
            mass: 2,
            type: "torso",
            restitution: 0.10
        }
    );

    ragdoll.leftArm = new Body(
        438,
        215,
        15,
        {
            width: 30,
            height: 65,
            mass: 0.8,
            type: "arm",
            restitution: 0.12,
            angle: -0.1
        }
    );

    ragdoll.rightArm = new Body(
        522,
        215,
        15,
        {
            width: 30,
            height: 65,
            mass: 0.8,
            type: "arm",
            restitution: 0.12,
            angle: 0.1
        }
    );

    ragdoll.leftLeg = new Body(
        465,
        290,
        16,
        {
            width: 32,
            height: 70,
            mass: 1,
            type: "leg",
            restitution: 0.12
        }
    );

    ragdoll.rightLeg = new Body(
        495,
        290,
        16,
        {
            width: 32,
            height: 70,
            mass: 1,
            type: "leg",
            restitution: 0.12
        }
    );
}

createRagdoll();

/* ---------------------------------------------------------
   Get ragdoll parts
   --------------------------------------------------------- */

function getParts() {
    return [
        ragdoll.head,
        ragdoll.torso,
        ragdoll.leftArm,
        ragdoll.rightArm,
        ragdoll.leftLeg,
        ragdoll.rightLeg
    ];
}

/* ---------------------------------------------------------
   Ragdoll joints
   --------------------------------------------------------- */

const joints = [
    {
        a: "head",
        b: "torso",
        length: 43,
        strength: 0.38
    },

    {
        a: "leftArm",
        b: "torso",
        length: 39,
        strength: 0.25
    },

    {
        a: "rightArm",
        b: "torso",
        length: 39,
        strength: 0.25
    },

    {
        a: "leftLeg",
        b: "torso",
        length: 42,
        strength: 0.30
    },

    {
        a: "rightLeg",
        b: "torso",
        length: 42,
        strength: 0.30
    }
];

function solveJoint(joint) {

    const a = ragdoll[joint.a];
    const b = ragdoll[joint.b];

    if (!a || !b) return;

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 0.0001) return;

    const difference =
        (dist - joint.length) / dist;

    const correctionX =
        dx * difference * joint.strength;

    const correctionY =
        dy * difference * joint.strength;

    if (!a.static && !a.grabbed) {
        a.x += correctionX * 0.5;
        a.y += correctionY * 0.5;
    }

    if (!b.static && !b.grabbed) {
        b.x -= correctionX * 0.5;
        b.y -= correctionY * 0.5;
    }

    /*
     * Damp relative velocity so the joints
     * don't explode into space.
     */

    const relativeVX = b.vx - a.vx;
    const relativeVY = b.vy - a.vy;

    const damping = 0.04;

    if (!a.grabbed) {
        a.vx += relativeVX * damping;
        a.vy += relativeVY * damping;
    }

    if (!b.grabbed) {
        b.vx -= relativeVX * damping;
        b.vy -= relativeVY * damping;
    }
}

/* ---------------------------------------------------------
   Objects
   --------------------------------------------------------- */

let objects = [];
let particles = [];

/* ---------------------------------------------------------
   Crate
   --------------------------------------------------------- */

function spawnCrate(x = random(100, WIDTH - 100), y = 100) {

    const crate = new Body(
        x,
        y,
        22,
        {
            width: 44,
            height: 44,
            mass: 2,
            type: "crate",
            restitution: 0.25,
            friction: 0.78
        }
    );

    crate.vx = random(-2, 2);
    crate.vy = random(-2, 1);

    objects.push(crate);
}

/* ---------------------------------------------------------
   Ball
   --------------------------------------------------------- */

function spawnBall(x = random(100, WIDTH - 100), y = 100) {

    const ball = new Body(
        x,
        y,
        18,
        {
            width: 36,
            height: 36,
            mass: 0.7,
            type: "ball",
            restitution: 0.72,
            friction: 0.93
        }
    );

    ball.vx = random(-3, 3);
    ball.vy = random(-4, 1);

    objects.push(ball);
}

/* ---------------------------------------------------------
   Cartoon bomb
   --------------------------------------------------------- */

function spawnBomb(x = random(100, WIDTH - 100), y = 100) {

    const bomb = new Body(
        x,
        y,
        20,
        {
            width: 40,
            height: 40,
            mass: 1.3,
            type: "bomb",
            restitution: 0.35,
            friction: 0.82
        }
    );

    bomb.vx = random(-2, 2);
    bomb.vy = random(-2, 1);

    bomb.fuse = 170;

    objects.push(bomb);
}

/* ---------------------------------------------------------
   Explosion
   --------------------------------------------------------- */

function explode(x, y, radius = 170) {

    /*
     * No sound.
     * No gore.
     * Pure cartoon physics.
     */

    for (const body of getParts()) {

        const dx = body.x - x;
        const dy = body.y - y;

        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < radius && dist > 0.01) {

            const power =
                (1 - dist / radius) * 15;

            body.vx += (dx / dist) * power;
            body.vy += (dy / dist) * power - 4;
            body.angularVelocity += random(-0.25, 0.25);
        }
    }

    for (const obj of objects) {

        const dx = obj.x - x;
        const dy = obj.y - y;

        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < radius && dist > 0.01) {

            const power =
                (1 - dist / radius) * 18;

            obj.vx += (dx / dist) * power;
            obj.vy += (dy / dist) * power - 4;
            obj.angularVelocity += random(-0.35, 0.35);
        }
    }

    for (let i = 0; i < 32; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            random(2, 8);

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: random(20, 40),
            size: random(3, 8)
        });
    }
}

/* ---------------------------------------------------------
   Collision helper
   --------------------------------------------------------- */

function circleCollision(a, b) {

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const dist =
        Math.sqrt(dx * dx + dy * dy);

    const minimum =
        (a.width + b.width) * 0.25;

    if (dist >= minimum || dist === 0) {
        return;
    }

    const nx = dx / dist;
    const ny = dy / dist;

    const overlap =
        minimum - dist;

    if (!a.grabbed) {
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
    }

    if (!b.grabbed) {
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;
    }

    const relativeVX = b.vx - a.vx;
    const relativeVY = b.vy - a.vy;

    const velocityAlongNormal =
        relativeVX * nx +
        relativeVY * ny;

    if (velocityAlongNormal > 0) {
        return;
    }

    const restitution = 0.25;

    const impulse =
        -(1 + restitution) *
        velocityAlongNormal /
        (1 / a.mass + 1 / b.mass);

    if (!a.grabbed) {
        a.vx -= nx * impulse / a.mass;
        a.vy -= ny * impulse / a.mass;
    }

    if (!b.grabbed) {
        b.vx += nx * impulse / b.mass;
        b.vy += ny * impulse / b.mass;
    }
}

/* ---------------------------------------------------------
   Pointer / grabbing
   --------------------------------------------------------- */

let pointer = {
    x: 0,
    y: 0,
    down: false
};

let grabbedBody = null;

function pointerPosition(event) {

    const rect = canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
    } else {
        clientX = event.clientX;
        clientY = event.clientY;
    }

    pointer.x =
        (clientX - rect.left) *
        (canvas.width / rect.width);

    pointer.y =
        (clientY - rect.top) *
        (canvas.height / rect.height);
}

function allBodies() {
    return [
        ...getParts(),
        ...objects
    ];
}

function findBodyAtPointer() {

    const bodies = allBodies();

    let closest = null;
    let closestDistance = Infinity;

    for (const body of bodies) {

        const dx =
            pointer.x - body.x;

        const dy =
            pointer.y - body.y;

        const dist =
            Math.sqrt(dx * dx + dy * dy);

        const hitRadius =
            Math.max(body.width, body.height) * 0.65;

        if (
            dist < hitRadius &&
            dist < closestDistance
        ) {
            closest = body;
            closestDistance = dist;
        }
    }

    return closest;
}

function beginGrab(event) {

    pointerPosition(event);

    pointer.down = true;

    grabbedBody =
        findBodyAtPointer();

    if (grabbedBody) {
        grabbedBody.grabbed = true;
        canvas.classList.add("grabbing");
    }
}

function moveGrab(event) {

    pointerPosition(event);

    if (!grabbedBody) return;

    const dx =
        pointer.x - grabbedBody.x;

    const dy =
        pointer.y - grabbedBody.y;

    grabbedBody.vx = dx * 0.55;
    grabbedBody.vy = dy * 0.55;

    grabbedBody.x += dx * 0.72;
    grabbedBody.y += dy * 0.72;
}

function endGrab() {

    pointer.down = false;

    if (grabbedBody) {
        grabbedBody.grabbed = false;
    }

    grabbedBody = null;

    canvas.classList.remove("grabbing");
}

/* ---------------------------------------------------------
   Mouse
   --------------------------------------------------------- */

canvas.addEventListener(
    "mousedown",
    beginGrab
);

window.addEventListener(
    "mousemove",
    event => {
        if (pointer.down) {
            moveGrab(event);
        }
    }
);

window.addEventListener(
    "mouseup",
    endGrab
);

/* ---------------------------------------------------------
   Touch
   --------------------------------------------------------- */

canvas.addEventListener(
    "touchstart",
    event => {
        event.preventDefault();
        beginGrab(event);
    },
    { passive: false }
);

canvas.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();

        if (pointer.down) {
            moveGrab(event);
        }
    },
    { passive: false }
);

canvas.addEventListener(
    "touchend",
    event => {
        event.preventDefault();
        endGrab();
    },
    { passive: false }
);

/* ---------------------------------------------------------
   Update ragdoll
   --------------------------------------------------------- */

function updateRagdoll() {

    const parts = getParts();

    /*
     * Integrate FIRST.
     * Gravity is positive, meaning downward.
     */

    for (const body of parts) {
        body.integrate();
    }

    /*
     * Multiple joint passes make the ragdoll
     * stay connected without shooting upward.
     */

    for (let i = 0; i < 5; i++) {

        for (const joint of joints) {
            solveJoint(joint);
        }

        for (const body of parts) {
            body.floorCollision();
        }
    }
}

/* ---------------------------------------------------------
   Update objects
   --------------------------------------------------------- */

function updateObjects() {

    for (const obj of objects) {

        obj.integrate();
        obj.floorCollision();

        if (obj.type === "bomb") {

            obj.fuse--;

            if (obj.fuse <= 0) {

                explode(
                    obj.x,
                    obj.y,
                    180
                );

                const index =
                    objects.indexOf(obj);

                if (index !== -1) {
                    objects.splice(index, 1);
                }
            }
        }
    }

    /*
     * Object-object collisions.
     */

    for (let i = 0; i < objects.length; i++) {

        for (
            let j = i + 1;
            j < objects.length;
            j++
        ) {

            circleCollision(
                objects[i],
                objects[j]
            );
        }
    }

    /*
     * Ragdoll-object collisions.
     */

    for (const part of getParts()) {

        for (const obj of objects) {

            circleCollision(
                part,
                obj
            );
        }
    }
}

/* ---------------------------------------------------------
   Particles
   --------------------------------------------------------- */

function updateParticles() {

    for (let i = particles.length - 1; i >= 0; i--) {

        const particle = particles[i];

        particle.vy += 0.18;

        particle.x += particle.vx;
        particle.y += particle.vy;

        particle.life--;

        if (particle.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

/* ---------------------------------------------------------
   Draw background
   --------------------------------------------------------- */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            HEIGHT
        );

    gradient.addColorStop(
        0,
        "#11101c"
    );

    gradient.addColorStop(
        1,
        "#08080d"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    /*
     * Subtle grid.
     */

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    ctx.lineWidth = 1;

    for (let x = 0; x <= WIDTH; x += 40) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
    }

    for (let y = 0; y <= HEIGHT; y += 40) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
    }

    /*
     * Floor.
     */

    ctx.fillStyle = "#191922";

    ctx.fillRect(
        0,
        FLOOR_Y,
        WIDTH,
        HEIGHT - FLOOR_Y
    );

    ctx.strokeStyle =
        "rgba(167,139,250,0.35)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        FLOOR_Y
    );

    ctx.lineTo(
        WIDTH,
        FLOOR_Y
    );

    ctx.stroke();
}

/* ---------------------------------------------------------
   Draw ragdoll
   --------------------------------------------------------- */

function drawRagdoll() {

    const head = ragdoll.head;
    const torso = ragdoll.torso;
    const leftArm = ragdoll.leftArm;
    const rightArm = ragdoll.rightArm;
    const leftLeg = ragdoll.leftLeg;
    const rightLeg = ragdoll.rightLeg;

    /*
     * Draw limbs behind torso.
     */

    drawBodyPart(
        leftArm,
        "#F5CD30",
        15
    );

    drawBodyPart(
        rightArm,
        "#F5CD30",
        15
    );

    drawBodyPart(
        leftLeg,
        "#A4BD47",
        16
    );

    drawBodyPart(
        rightLeg,
        "#A4BD47",
        16
    );

    /*
     * Torso.
     */

    drawBodyPart(
        torso,
        "#0D69AC",
        16
    );

    /*
     * Head.
     */

    drawHead(head);
}

/* ---------------------------------------------------------
   Draw generic body part
   --------------------------------------------------------- */

function drawBodyPart(
    body,
    color,
    radius
) {

    ctx.save();

    ctx.translate(
        body.x,
        body.y
    );

    ctx.rotate(body.angle);

    ctx.fillStyle = color;

    ctx.strokeStyle =
        "rgba(0,0,0,0.30)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.roundRect(
        -body.width / 2,
        -body.height / 2,
        body.width,
        body.height,
        radius
    );

    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

/* ---------------------------------------------------------
   Draw Noob head
   --------------------------------------------------------- */

function drawHead(head) {

    ctx.save();

    ctx.translate(
        head.x,
        head.y
    );

    ctx.rotate(head.angle);

    ctx.fillStyle =
        "#F5CD30";

    ctx.strokeStyle =
        "rgba(0,0,0,0.30)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.roundRect(
        -25,
        -25,
        50,
        50,
        9
    );

    ctx.fill();
    ctx.stroke();

    /*
     * Original goofy face.
     * Not a Roblox asset.
     */

    ctx.fillStyle = "#171717";

    ctx.beginPath();

    ctx.arc(
        -9,
        -4,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        9,
        -4,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#171717";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        9,
        0.15,
        Math.PI - 0.15
    );

    ctx.stroke();

    ctx.restore();
}

/* ---------------------------------------------------------
   Draw objects
   --------------------------------------------------------- */

function drawObjects() {

    for (const obj of objects) {

        if (obj.type === "crate") {
            drawCrate(obj);
        }

        else if (obj.type === "ball") {
            drawBall(obj);
        }

        else if (obj.type === "bomb") {
            drawBomb(obj);
        }
    }
}

/* ---------------------------------------------------------
   Crate
   --------------------------------------------------------- */

function drawCrate(obj) {

    ctx.save();

    ctx.translate(
        obj.x,
        obj.y
    );

    ctx.rotate(obj.angle);

    ctx.fillStyle =
        "#A66A35";

    ctx.strokeStyle =
        "#5B351A";

    ctx.lineWidth = 3;

    ctx.fillRect(
        -22,
        -22,
        44,
        44
    );

    ctx.strokeRect(
        -22,
        -22,
        44,
        44
    );

    ctx.strokeStyle =
        "rgba(255,220,170,0.55)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(-16, -16);
    ctx.lineTo(16, 16);

    ctx.moveTo(16, -16);
    ctx.lineTo(-16, 16);

    ctx.stroke();

    ctx.restore();
}

/* ---------------------------------------------------------
   Ball
   --------------------------------------------------------- */

function drawBall(obj) {

    ctx.save();

    ctx.translate(
        obj.x,
        obj.y
    );

    ctx.rotate(obj.angle);

    ctx.fillStyle =
        "#F4F4F5";

    ctx.strokeStyle =
        "rgba(0,0,0,0.4)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle =
        "#777";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(-7, -15);
    ctx.lineTo(0, -5);
    ctx.lineTo(9, -12);

    ctx.moveTo(-17, 1);
    ctx.lineTo(-5, 4);
    ctx.lineTo(-9, 15);

    ctx.stroke();

    ctx.restore();
}

/* ---------------------------------------------------------
   Bomb
   --------------------------------------------------------- */

function drawBomb(obj) {

    ctx.save();

    ctx.translate(
        obj.x,
        obj.y
    );

    ctx.rotate(obj.angle);

    ctx.fillStyle =
        "#25252D";

    ctx.strokeStyle =
        "#0A0A0D";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    /*
     * Fuse.
     */

    ctx.strokeStyle =
        "#C9C9D1";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        7,
        -12
    );

    ctx.quadraticCurveTo(
        14,
        -23,
        10,
        -28
    );

    ctx.stroke();

    /*
     * Tiny fuse spark.
     */

    if (
        Math.floor(obj.fuse / 5) % 2 === 0
    ) {

        ctx.fillStyle =
            "#FFD43B";

        ctx.beginPath();

        ctx.arc(
            10,
            -29,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* ---------------------------------------------------------
   Draw particles
   --------------------------------------------------------- */

function drawParticles() {

    for (const particle of particles) {

        ctx.globalAlpha =
            clamp(
                particle.life / 40,
                0,
                1
            );

        ctx.fillStyle =
            "#A78BFA";

        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------
   Main render
   --------------------------------------------------------- */

function render() {

    drawBackground();

    drawObjects();

    drawRagdoll();

    drawParticles();
}

/* ---------------------------------------------------------
   Main loop
   --------------------------------------------------------- */

function gameLoop() {

    updateRagdoll();

    updateObjects();

    updateParticles();

    render();

    requestAnimationFrame(gameLoop);
}

gameLoop();

/* ---------------------------------------------------------
   Buttons
   --------------------------------------------------------- */

const spawnButton =
    document.getElementById("spawnButton");

const spawnMenu =
    document.getElementById("spawnMenu");

const crateButton =
    document.getElementById("crateButton");

const ballButton =
    document.getElementById("ballButton");

const bombButton =
    document.getElementById("bombButton");

const boomButton =
    document.getElementById("boomButton");

const resetButton =
    document.getElementById("resetButton");

const clearButton =
    document.getElementById("clearButton");

spawnButton.addEventListener(
    "click",
    () => {
        spawnMenu.classList.toggle("open");
    }
);

crateButton.addEventListener(
    "click",
    () => {
        spawnCrate();
    }
);

ballButton.addEventListener(
    "click",
    () => {
        spawnBall();
    }
);

bombButton.addEventListener(
    "click",
    () => {
        spawnBomb();
    }
);

boomButton.addEventListener(
    "click",
    () => {

        explode(
            ragdoll.torso.x,
            ragdoll.torso.y,
            180
        );
    }
);

resetButton.addEventListener(
    "click",
    () => {
        createRagdoll();
    }
);

clearButton.addEventListener(
    "click",
    () => {
        objects = [];
        particles = [];
    }
);

/* ---------------------------------------------------------
   Keyboard controls
   --------------------------------------------------------- */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "r" ||
            event.key === "R"
        ) {
            createRagdoll();
        }

        if (
            event.key === "c" ||
            event.key === "C"
        ) {
            spawnCrate();
        }

        if (
            event.key === "b" ||
            event.key === "B"
        ) {
            spawnBall();
        }

        if (
            event.key === "x" ||
            event.key === "X"
        ) {
            spawnBomb();
        }

        if (event.code === "Space") {

            event.preventDefault();

            explode(
                ragdoll.torso.x,
                ragdoll.torso.y,
                180
            );
        }
    }
);
</script>
