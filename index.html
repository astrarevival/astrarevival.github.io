<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astra</title>

    <link rel="icon" type="image/x-icon" href="astraicontransparent.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                linear-gradient(
                    rgba(5, 3, 15, 0.55),
                    rgba(5, 3, 15, 0.72)
                ),
                url("space-background.png") center center / cover no-repeat fixed;

            overflow: hidden;
        }

        /* ------------------------------
           TOP BAR
        ------------------------------ */

        .topbar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 40px);
            max-width: 1200px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            background: rgba(15, 10, 30, 0.65);
            border: 1px solid rgba(190, 130, 255, 0.18);
            border-radius: 18px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35),
                inset 0 0 25px rgba(160, 80, 255, 0.04);

            z-index: 10;

            animation: barEnter 0.8s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;

            filter: drop-shadow(
                0 0 10px rgba(160, 90, 255, 0.55)
            );
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 9px 15px;

            border-radius: 999px;

            background: rgba(130, 70, 190, 0.12);
            border: 1px solid rgba(190, 130, 255, 0.18);

            color: rgba(255, 255, 255, 0.8);

            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #b56cff;

            box-shadow:
                0 0 8px #b56cff,
                0 0 18px rgba(181, 108, 255, 0.7);

            animation: pulse 2s infinite;
        }

        /* ------------------------------
           MAIN CONTENT
        ------------------------------ */

        .page {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 110px 20px 40px;
        }

        .maintenance {
            width: 100%;
            max-width: 720px;

            text-align: center;

            padding: 60px 40px;

            background: rgba(12, 8, 25, 0.62);

            border: 1px solid rgba(190, 130, 255, 0.16);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                0 0 80px rgba(120, 50, 220, 0.08);

            animation: cardEnter 1s ease;
        }

        .logo {
            width: 150px;
            height: 150px;

            object-fit: contain;

            margin-bottom: 25px;

            filter:
                drop-shadow(0 0 15px rgba(160, 80, 255, 0.4))
                drop-shadow(0 0 40px rgba(160, 80, 255, 0.12));

            animation: floating 4s ease-in-out infinite;
        }

        .label {
            display: inline-block;

            margin-bottom: 18px;

            padding: 7px 14px;

            border-radius: 999px;

            background: rgba(150, 80, 230, 0.12);
            border: 1px solid rgba(190, 130, 255, 0.18);

            color: #d9baff;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(46px, 8vw, 76px);

            line-height: 1;

            margin-bottom: 20px;

            font-weight: 800;

            letter-spacing: -2px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #d9baff,
                    #9c5cff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 40px rgba(160, 80, 255, 0.15);
        }

        .description {
            max-width: 540px;

            margin: 0 auto 30px;

            color: rgba(255, 255, 255, 0.65);

            font-size: 17px;
            line-height: 1.7;
        }

        .soon {
            font-size: 32px;
            font-weight: 700;

            color: white;

            margin-bottom: 10px;
        }

        .subtext {
            color: rgba(255, 255, 255, 0.4);

            font-size: 14px;
        }

        /* ------------------------------
           FOOTER
        ------------------------------ */

        .footer {
            position: fixed;

            bottom: 20px;
            left: 0;

            width: 100%;

            text-align: center;

            color: rgba(255, 255, 255, 0.3);

            font-size: 12px;

            pointer-events: none;
        }

        /* ------------------------------
           ANIMATIONS
        ------------------------------ */

        @keyframes barEnter {
            from {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(-20px);
            }

            to {
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes floating {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ------------------------------
           MOBILE
        ------------------------------ */

        @media (max-width: 600px) {

            .topbar {
                top: 12px;
                width: calc(100% - 24px);
                height: 62px;

                padding: 0 16px;
            }

            .brand {
                font-size: 19px;
            }

            .brand img {
                width: 32px;
                height: 32px;
            }

            .status {
                padding: 7px 11px;
                font-size: 12px;
            }

            .maintenance {
                padding: 45px 24px;
                border-radius: 22px;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .description {
                font-size: 15px;
            }

            .soon {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION -->

    <header class="topbar">

        <div class="brand">
            <img src="astraicontransparent.ico" alt="Astra">
            <span>Astra</span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span>Maintenance</span>
        </div>

    </header>


    <!-- MAIN PAGE -->

    <main class="page">

        <section class="maintenance">

            <img
                class="logo"
                src="astraicontransparent.ico"
                alt="Astra Logo"
            >

            <div class="label">
                Astra
            </div>

            <h1>
                We're working on it.
            </h1>

            <p class="description">
                Astra is currently undergoing maintenance while
                we work on the next version of the platform.
            </p>

            <div class="soon">
                Soon.
            </div>

            <div class="subtext">
                Thanks for waiting.
            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">
        Astra © 2026
    </footer>

</body>
</html>
