<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Astra</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="images/astraicontransparent.ico"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(126, 87, 255, 0.18),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #08070d 0%,
          #100b1b 50%,
          #08070d 100%
        );

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 80%,
          rgba(109, 67, 255, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 30%,
          rgba(169, 80, 255, 0.06),
          transparent 30%
        );

      z-index: -1;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: fixed;

      top: 14px;
      left: 14px;
      right: 14px;

      height: 58px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;

      background:
        rgba(20, 17, 30, 0.68);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.25);

      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .brand img {
      width: 34px;
      height: 34px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 12px;

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.055);

      color: rgba(255, 255, 255, 0.82);

      font-size: 12px;
      font-weight: 650;

      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #9a6cff;

      box-shadow:
        0 0 10px rgba(154, 108, 255, 0.85);

      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    /* =========================
       MAIN
    ========================= */

    .page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        100px 20px
        80px;
    }

    .maintenance-card {
      width: min(680px, 100%);

      padding: 48px 42px 42px;

      text-align: center;

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(31, 25, 45, 0.76),
          rgba(15, 12, 23, 0.82)
        );

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.42),
        0 0 70px rgba(121, 73, 255, 0.08);

      animation: cardIn 0.65s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 22px;
    }

    .logo {
      width: min(360px, 80vw);
      max-height: 150px;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 25px rgba(143, 91, 255, 0.18)
        );
    }

    .small-label {
      margin-bottom: 10px;

      color: rgba(255, 255, 255, 0.5);

      font-size: 12px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    h1 {
      margin-bottom: 14px;

      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.08;

      letter-spacing: -0.045em;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #cdbbff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .description {
      max-width: 540px;

      margin: 0 auto;

      color: rgba(255, 255, 255, 0.62);

      font-size: 15px;
      line-height: 1.7;
    }

    .soon {
      margin-top: 24px;

      color: #b99aff;

      font-size: 15px;
      font-weight: 750;

      letter-spacing: 0.02em;
    }

    .thanks {
      margin-top: 7px;

      color: rgba(255, 255, 255, 0.4);

      font-size: 13px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: 30px;
    }

    .button {
      min-height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 0 18px;

      border-radius: 13px;

      font-size: 13px;
      font-weight: 750;

      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-primary {
      border: 1px solid rgba(160, 125, 255, 0.45);

      background:
        linear-gradient(
          135deg,
          #7651dc,
          #6240bd
        );

      color: white;

      box-shadow:
        0 8px 28px rgba(109, 69, 215, 0.22);
    }

    .button-primary:hover {
      background:
        linear-gradient(
          135deg,
          #8360e8,
          #704bcf
        );

      box-shadow:
        0 10px 34px rgba(109, 69, 215, 0.32);
    }

    .button-secondary {
      border: 1px solid rgba(255, 255, 255, 0.11);

      background:
        rgba(255, 255, 255, 0.055);

      color: rgba(255, 255, 255, 0.9);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .button-secondary:hover {
      border-color: rgba(160, 125, 255, 0.3);

      background:
        rgba(128, 86, 235, 0.13);
    }

    .button-icon {
      font-size: 17px;
      line-height: 1;
    }

    /* =========================
       DISCLAIMER
    ========================= */

    .disclaimer {
      max-width: 500px;

      margin: 30px auto 0;

      color: rgba(255, 255, 255, 0.3);

      font-size: 11px;
      line-height: 1.6;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 18px;

      text-align: center;

      color: rgba(255, 255, 255, 0.25);

      font-size: 11px;

      pointer-events: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .topbar {
        top: 9px;
        left: 9px;
        right: 9px;

        height: 52px;

        padding: 0 12px;

        border-radius: 14px;
      }

      .brand img {
        width: 30px;
        height: 30px;
      }

      .brand-name {
        font-size: 15px;
      }

      .status {
        padding: 7px 9px;
        gap: 6px;

        font-size: 10px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
      }

      .page {
        padding:
          82px 14px
          70px;
      }

      .maintenance-card {
        padding: 34px 20px 30px;

        border-radius: 22px;
      }

      .logo {
        width: min(300px, 82vw);
        max-height: 120px;
      }

      .small-label {
        font-size: 10px;
      }

      h1 {
        font-size: 32px;
      }

      .description {
        font-size: 14px;
        line-height: 1.65;
      }

      .actions {
        flex-direction: column;

        width: 100%;
      }

      .button {
        width: 100%;
        min-height: 48px;
      }

      .disclaimer {
        margin-top: 24px;
      }

      footer {
        bottom: 12px;

        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP BAR
  ========================= -->

  <header class="topbar">

    <div class="brand">
      <img
        src="images/astraicontransparent.ico"
        alt="Astra"
      >

      <span class="brand-name">
        Astra
      </span>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>Maintenance</span>
    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="page">

    <section class="maintenance-card">

      <div class="logo-wrap">
        <img
          class="logo"
          src="images/astrafulllogo.ico"
          alt="Astra"
        >
      </div>

      <div class="small-label">
        Astra
      </div>

      <h1>
        We're working on it.
      </h1>

      <p class="description">
        Astra is currently undergoing maintenance while we work
        on the next version of the platform.
      </p>

      <div class="soon">
        Soon.
      </div>

      <div class="thanks">
        Thanks for waiting.
      </div>


      <!-- =========================
           BUTTONS
      ========================= -->

      <div class="actions">

        <a
          class="button button-primary"
          href="noobsandbox.html"
        >
          <span class="button-icon">🎮</span>
          <span>Play Noob Sandbox</span>
        </a>

        <a
          class="button button-secondary"
          href="https://discord.gg/phBMKsYv4E"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="button-icon">💬</span>
          <span>Join Discord Server</span>
        </a>

      </div>


      <p class="disclaimer">
        Astra is not affiliated with or endorsed by Roblox Corporation.
      </p>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    Astra © 2026
  </footer>

</body>
</html>
