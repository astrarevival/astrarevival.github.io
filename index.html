<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astra</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="images/astraicontransparent.ico"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(126, 55, 220, 0.30),
                    transparent 42%
                ),
                linear-gradient(
                    135deg,
                    #05030d 0%,
                    #0c0617 45%,
                    #18092b 100%
                );
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 40px);
            max-width: 1200px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            background: rgba(12, 8, 22, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 18px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            z-index: 10;
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 9px 15px;

            font-size: 13px;
            font-weight: 600;

            color: #e7d9ff;

            background: rgba(125, 60, 210, 0.14);
            border: 1px solid rgba(160, 100, 240, 0.20);
            border-radius: 999px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            background: #a96cff;
            border-radius: 50%;

            box-shadow:
                0 0 10px rgba(169, 108, 255, 0.9);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.55;
                transform: scale(0.85);
            }
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 110px 20px 40px;
        }

        /* =========================
           MAINTENANCE CARD
        ========================= */

        .card {
            width: min(620px, 100%);
            min-height: 570px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 55px 45px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.055),
                    rgba(255, 255, 255, 0.018)
                );

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 30px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.45),
                0 0 80px rgba(117, 52, 210, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            animation: cardIn 0.8s ease-out;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 190px;
            height: 190px;

            object-fit: contain;

            margin-bottom: 25px;

            filter:
                drop-shadow(0 0 22px rgba(142, 76, 235, 0.25));

            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* =========================
           LABEL
        ========================= */

        .label {
            margin-bottom: 13px;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 3px;
            text-transform: uppercase;

            color: #b58cff;
        }

        /* =========================
           HEADING
        ========================= */

        h1 {
            margin-bottom: 17px;

            font-size: clamp(36px, 6vw, 52px);
            line-height: 1.05;

            letter-spacing: -2px;
            font-weight: 800;
        }

        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            max-width: 470px;

            margin-bottom: 28px;

            font-size: 16px;
            line-height: 1.7;

            color: rgba(255, 255, 255, 0.63);
        }

        /* =========================
           SOON
        ========================= */

        .soon {
            margin-bottom: 8px;

            font-size: 19px;
            font-weight: 700;

            color: #ffffff;
        }

        .thanks {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.40);
        }

        /* =========================
           DISCLAIMER
        ========================= */

        .disclaimer {
            position: fixed;

            bottom: 38px;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            text-align: center;

            font-size: 11px;
            line-height: 1.5;

            color: rgba(255, 255, 255, 0.22);

            white-space: nowrap;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: fixed;

            bottom: 18px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 12px;

            color: rgba(255, 255, 255, 0.28);

            white-space: nowrap;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .topbar {
                top: 12px;

                width: calc(100% - 24px);
                height: 62px;

                padding: 0 15px;

                border-radius: 15px;
            }

            .brand {
                font-size: 18px;
            }

            .brand img {
                width: 31px;
                height: 31px;
            }

            .status {
                padding: 8px 11px;
                font-size: 12px;
            }

            main {
                padding:
                    95px
                    12px
                    50px;
            }

            .card {
                min-height: 520px;

                padding: 45px 25px;

                border-radius: 24px;
            }

            .logo {
                width: 145px;
                height: 145px;

                margin-bottom: 20px;
            }

            h1 {
                font-size: 38px;
                letter-spacing: -1.5px;
            }

            .description {
                font-size: 14px;
                line-height: 1.65;
            }

            .disclaimer {
                bottom: 38px;
                font-size: 10px;
            }

            footer {
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">
            <img
                src="images/astraicontransparent.ico"
                alt="Astra"
            >

            <span>Astra</span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span>Maintenance</span>
        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        <section class="card">

            <img
                class="logo"
                src="images/astrafulllogo.ico"
                alt="Astra"
            >

            <div class="label">
                Astra
            </div>

            <h1>
                We're working on it.
            </h1>

            <p class="description">
                Astra is currently undergoing maintenance while
                we work on the next version of the platform.
            </p>

            <div class="soon">
                Soon.
            </div>

            <div class="thanks">
                Thanks for waiting.
            </div>

        </section>

    </main>


    <!-- DISCLAIMER -->

    <div class="disclaimer">
        Astra is not affiliated with or endorsed by Roblox Corporation.
    </div>


    <!-- FOOTER -->

    <footer>
        Astra © 2026
    </footer>

</body>
</html>
