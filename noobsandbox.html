<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Noob Sandbox</title>
<link rel="icon" href="images/astraicontransparent.ico">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08060e;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  user-select: none;
  touch-action: none;
}

body {
  position: fixed;
  inset: 0;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* =========================
   TOP BAR
========================= */

.topbar {
  position: fixed;
  z-index: 50;
  top: 14px;
  left: 14px;
  right: 14px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  background: rgba(17,12,30,.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 12px 35px rgba(0,0,0,.3);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 17px;
  font-weight: 800;
}

.brand img {
  width: 31px;
  height: 31px;
  object-fit: contain;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,.72);
  font-size: 13px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #a855f7;
  box-shadow: 0 0 12px #a855f7;
}

/* =========================
   LEADERBOARD
========================= */

.leaderboard {
  position: fixed;
  z-index: 80;
  top: 84px;
  right: 16px;
  width: 245px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 170px);
  overflow-y: auto;
  padding: 12px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 15px;
  background: rgba(15,10,27,.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 15px 40px rgba(0,0,0,.28);
  pointer-events: auto;
  transition: opacity .18s ease, transform .18s ease;
}

.leaderboard.hidden-for-spawn {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
}

.leaderboard-title {
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 900;
  color: rgba(255,255,255,.65);
  text-transform: uppercase;
  letter-spacing: .08em;
}

.leaderboard-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.leader-row {
  display: grid;
  grid-template-columns: minmax(0,1fr) 30px;
  gap: 7px;
  align-items: center;
  min-height: 40px;
  padding: 7px 8px;
  border-radius: 10px;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.06);
}

.leader-main {
  min-width: 0;
}

.leader-name-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.leader-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 800;
}

.leader-type {
  flex-shrink: 0;
  color: rgba(255,255,255,.42);
  font-size: 9px;
}

.leader-health-track {
  width: 100%;
  height: 5px;
  margin-top: 5px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255,255,255,.09);
}

.leader-health-bar {
  height: 100%;
  width: 100%;
  border-radius: 999px;
  transition: width .12s ease, background .12s ease;
}

.leader-health-text {
  margin-top: 2px;
  color: rgba(255,255,255,.42);
  font-size: 8px;
}

.rename-button {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  color: white;
  background: rgba(255,255,255,.07);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 15px;
  touch-action: manipulation;
}

.rename-button:hover,
.rename-button:active {
  background: rgba(168,85,247,.25);
}

.leader-empty {
  padding: 8px;
  color: rgba(255,255,255,.4);
  text-align: center;
  font-size: 11px;
}

/* =========================
   ASTRA BUTTON
========================= */

.astra-button {
  position: fixed;
  z-index: 60;
  left: 16px;
  bottom: 16px;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 16px;
  background: rgba(18,12,31,.84);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow: 0 12px 35px rgba(0,0,0,.4);
  cursor: pointer;
}

.astra-button img {
  width: 31px;
  height: 31px;
}

/* =========================
   ASTRA PANEL
========================= */

.astra-panel {
  position: fixed;
  z-index: 59;
  left: 16px;
  bottom: 82px;
  width: 300px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 105px);
  overflow-y: auto;
  padding: 17px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 19px;
  background: rgba(15,10,27,.92);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
  opacity: 0;
  transform: translateY(12px) scale(.96);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}

.astra-panel.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.panel-title {
  font-size: 18px;
  font-weight: 800;
}

.panel-subtitle {
  margin-top: 3px;
  margin-bottom: 17px;
  color: rgba(255,255,255,.5);
  font-size: 12px;
}

.setting {
  margin-bottom: 16px;
}

.setting-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  font-size: 13px;
  color: rgba(255,255,255,.78);
}

.setting-value {
  color: #c084fc;
  font-weight: 800;
}

input[type="range"] {
  width: 100%;
  accent-color: #a855f7;
}

input[type="color"] {
  width: 100%;
  height: 38px;
  padding: 2px;
  border: 0;
  border-radius: 9px;
  background: rgba(255,255,255,.08);
}

/* =========================
   BUTTONS
========================= */

.ui-button {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 11px;
  color: white;
  background: rgba(255,255,255,.07);
  cursor: pointer;
  transition: background .15s ease, transform .12s ease;
}

.ui-button:hover {
  background: rgba(255,255,255,.12);
}

.ui-button:active {
  transform: scale(.97);
}

.ui-button.primary {
  background: linear-gradient(135deg,#7c3aed,#a855f7);
}

/* =========================
   SPAWN BUTTON
========================= */

.spawn-button {
  position: fixed;
  z-index: 60;
  right: 16px;
  bottom: 16px;
  width: 54px;
  height: 54px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 16px;
  color: white;
  background: rgba(18,12,31,.84);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow: 0 12px 35px rgba(0,0,0,.4);
  font-size: 28px;
  cursor: pointer;
}

/* =========================
   SPAWN MENU
========================= */

.spawn-menu {
  position: fixed;
  z-index: 90;
  right: 16px;
  bottom: 82px;
  width: 255px;
  max-width: calc(100vw - 32px);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 18px;
  overflow: hidden;
  background: rgba(15,10,27,.92);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
  opacity: 0;
  transform: translateY(10px) scale(.96);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}

.spawn-menu.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.spawn-header {
  padding: 13px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  font-weight: 800;
  cursor: grab;
}

.spawn-options {
  padding: 8px;
}

.spawn-option {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  color: white;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.spawn-option:hover {
  background: rgba(168,85,247,.15);
}

/* =========================
   MOBILE CONTROLS
========================= */

.mobile-controls {
  position: fixed;
  z-index: 45;
  left: 15px;
  right: 15px;
  bottom: 86px;
  display: none;
  align-items: flex-end;
  pointer-events: none;
}

.joystick {
  width: 112px;
  height: 112px;
  position: relative;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 50%;
  background: rgba(255,255,255,.06);
  pointer-events: auto;
}

.joystick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  background: rgba(168,85,247,.72);
  border: 1px solid rgba(255,255,255,.2);
}

.mobile-actions {
  margin-left: auto;
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.mobile-action {
  width: 63px;
  height: 63px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
  color: white;
  background: rgba(18,12,31,.85);
  backdrop-filter: blur(12px);
  font-size: 10px;
  font-weight: 800;
}

.mobile-action.active {
  background: rgba(168,85,247,.72);
}

@media (pointer: coarse) {
  .mobile-controls {
    display: flex;
  }
}

/* =========================
   TOAST
========================= */

.toast {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: 22px;
  transform: translate(-50%,20px);
  padding: 10px 15px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px;
  background: rgba(17,11,29,.92);
  backdrop-filter: blur(12px);
  color: white;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%,0);
}

@media (max-width: 600px) {
  .topbar {
    top: 9px;
    left: 9px;
    right: 9px;
    height: 52px;
  }

  .status {
    display: none;
  }

  .leaderboard {
    top: 70px;
    right: 9px;
    width: 205px;
    max-height: calc(100vh - 145px);
  }

  .astra-button {
    left: 12px;
    bottom: 12px;
  }

  .spawn-button {
    right: 12px;
    bottom: 12px;
  }

  .astra-panel {
    left: 12px;
    bottom: 76px;
  }

  .spawn-menu {
    right: 12px;
    bottom: 76px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="topbar">
  <div class="brand">
    <img src="images/astraicontransparent.ico" alt="Astra">
    <span>Noob Sandbox</span>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    <span id="characterStatus">No character found</span>
  </div>
</div>

<div class="leaderboard">
  <div class="leaderboard-title">Sandbox</div>
  <div class="leaderboard-list" id="leaderboardList"></div>
</div>

<button class="astra-button" id="astraButton" aria-label="Astra menu">
  <img src="images/astraicontransparent.ico" alt="Astra">
</button>

<div class="astra-panel" id="astraPanel">

  <div class="panel-title">Astra Menu</div>

  <div class="panel-subtitle">
    Character and sandbox settings
  </div>

  <div class="setting">
    <div class="setting-label">
      <span>Walk Speed</span>
      <span class="setting-value" id="walkSpeedValue">420</span>
    </div>
    <input id="walkSpeed" type="range" min="100" max="1200" step="10" value="420">
  </div>

  <div class="setting">
    <div class="setting-label">
      <span>Jump Power</span>
      <span class="setting-value" id="jumpPowerValue">720</span>
    </div>
    <input id="jumpPower" type="range" min="200" max="1500" step="10" value="720">
  </div>

  <div class="setting">
    <div class="setting-label">
      <span>Running</span>
      <span class="setting-value" id="runningValue">ON</span>
    </div>

    <button class="ui-button primary" id="runningToggle">
      Running: ON
    </button>
  </div>

  <div class="setting">
    <div class="setting-label">
      <span>Run Speed</span>
      <span class="setting-value" id="runSpeedValue">700</span>
    </div>
    <input id="runSpeed" type="range" min="200" max="1800" step="10" value="700">
  </div>

  <div class="setting">
    <div class="setting-label"><span>Head Color</span></div>
    <input id="headColor" type="color" value="#F5CD30">
  </div>

  <div class="setting">
    <div class="setting-label"><span>Torso Color</span></div>
    <input id="torsoColor" type="color" value="#0D69AC">
  </div>

  <div class="setting">
    <div class="setting-label"><span>Left Arm</span></div>
    <input id="leftArmColor" type="color" value="#F5CD30">
  </div>

  <div class="setting">
    <div class="setting-label"><span>Right Arm</span></div>
    <input id="rightArmColor" type="color" value="#F5CD30">
  </div>

  <div class="setting">
    <div class="setting-label"><span>Left Leg</span></div>
    <input id="leftLegColor" type="color" value="#A4BD47">
  </div>

  <div class="setting">
    <div class="setting-label"><span>Right Leg</span></div>
    <input id="rightLegColor" type="color" value="#A4BD47">
  </div>

  <button class="ui-button" id="resetCharacter">
    Reset Character
  </button>

  <br><br>

  <button class="ui-button" id="deleteCharacter">
    Delete Character
  </button>

</div>

<button class="spawn-button" id="spawnButton">+</button>

<div class="spawn-menu" id="spawnMenu">

  <div class="spawn-header" id="spawnHeader">
    Spawn Menu
  </div>

  <div class="spawn-options">

    <button class="spawn-option" id="spawnMe">
      🧍 My Character
    </button>

    <button class="spawn-option" id="spawnNoob">
      🟨 Noob
    </button>

    <button class="spawn-option" id="spawnCrate">
      📦 Crate
    </button>

    <button class="spawn-option" id="spawnBomb">
      💣 Bomb
    </button>

    <button class="spawn-option" id="resetSandbox">
      ♻ Reset Sandbox
    </button>

  </div>
</div>

<div class="mobile-controls">

  <div class="joystick" id="joystick">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>

  <div class="mobile-actions">

    <button class="mobile-action" id="mobileJump">
      JUMP
    </button>

    <button class="mobile-action" id="mobileRun">
      RUN
    </button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
resize();

const WORLD = {
  gravity: 1850,
  floorHeight: 38,
  wallBounce: .38,
  collisionBounce: .18,
  playerAcceleration: 3600,
  playerGroundFriction: 8,
  playerAirFriction: 1.2,
  objectGroundFriction: 22,
  objectAirFriction: .15,
  objectBounce: .30,
  maxObjectSpeed: 2200,
  maxObjects: 100
};

const SETTINGS = {
  walkSpeed: 420,
  jumpPower: 720,
  runningEnabled: true,
  runSpeed: 700,

  colors: {
    head: "#F5CD30",
    torso: "#0D69AC",
    leftArm: "#F5CD30",
    rightArm: "#F5CD30",
    leftLeg: "#A4BD47",
    rightLeg: "#A4BD47"
  }
};

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function damp(value, amount, dt) {
  return value * Math.exp(-amount * dt);
}

/* =========================
   KEYBOARD
========================= */

const keys = new Set();

window.addEventListener("keydown", e => {

  keys.add(e.key.toLowerCase());

  if (
    [" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(
      e.key.toLowerCase()
    )
  ) {
    e.preventDefault();
  }

  if (
    e.key.toLowerCase() === "w" ||
    e.key.toLowerCase() === "arrowup" ||
    e.key === " "
  ) {
    if (player) {
      player.jumpRequested = true;
    }
  }
});

window.addEventListener("keyup", e => {
  keys.delete(e.key.toLowerCase());
});

function leftPressed() {
  return keys.has("a") || keys.has("arrowleft");
}

function rightPressed() {
  return keys.has("d") || keys.has("arrowright");
}

function runPressed() {
  return keys.has("shift") || mobileRunning;
}

/* =========================
   MOBILE JOYSTICK
========================= */

let joystickX = 0;
let joystickPointer = null;

const joystick = document.getElementById("joystick");
const joystickKnob = document.getElementById("joystickKnob");

function updateJoystick(clientX) {

  const rect = joystick.getBoundingClientRect();
  const center = rect.left + rect.width / 2;

  let dx = clientX - center;
  const max = rect.width * .35;

  dx = clamp(dx, -max, max);
  joystickX = dx / max;

  joystickKnob.style.transform =
    `translate(calc(-50% + ${dx}px), -50%)`;
}

joystick.addEventListener("pointerdown", e => {

  joystickPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);

  updateJoystick(e.clientX);
});

joystick.addEventListener("pointermove", e => {

  if (e.pointerId !== joystickPointer) return;

  updateJoystick(e.clientX);
});

function resetJoystick(e) {

  if (e.pointerId !== joystickPointer) return;

  joystickPointer = null;
  joystickX = 0;

  joystickKnob.style.transform =
    "translate(-50%, -50%)";
}

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

let mobileRunning = false;

const mobileRun = document.getElementById("mobileRun");

mobileRun.addEventListener("pointerdown", e => {

  e.preventDefault();

  mobileRunning = true;
  mobileRun.classList.add("active");
});

function stopMobileRun() {

  mobileRunning = false;
  mobileRun.classList.remove("active");
}

mobileRun.addEventListener("pointerup", stopMobileRun);
mobileRun.addEventListener("pointercancel", stopMobileRun);
mobileRun.addEventListener("pointerleave", stopMobileRun);

/* =========================
   PLAYER
========================= */

const PLAYER_WIDTH = 42;
const PLAYER_HEIGHT = 76;

let player = null;

function createPlayer(x, y) {

  return {
    type: "player",
    x,
    y,
    vx: 0,
    vy: 0,
    width: PLAYER_WIDTH,
    height: PLAYER_HEIGHT,
    grounded: false,
    jumpRequested: false,
    facing: 1,
    running: false,
    health: 100,
    maxHealth: 100,
    respawning: false,
    name: "You",

    colors: {
      ...SETTINGS.colors
    }
  };
}

function spawnPlayer() {

  if (player) {
    showToast("Character already exists");
    return;
  }

  player = createPlayer(W / 2, 120);

  updateStatus();
  updateLeaderboard();

  showToast("Character spawned!");
}

function deletePlayer() {

  if (!player) {
    showToast("No character found");
    return;
  }

  player = null;

  updateStatus();
  updateLeaderboard();

  showToast("Character deleted!");
}

function resetPlayer() {

  if (!player) {
    showToast("No character found");
    return;
  }

  player = createPlayer(W / 2, 120);

  updateStatus();
  updateLeaderboard();

  showToast("Character reset!");
}

/* =========================
   OBJECTS
========================= */

const objects = [];

function spawnObject(type, x, y) {

  if (objects.length >= WORLD.maxObjects) {
    objects.shift();
  }

  if (type === "noob") {

    objects.push({
      type: "noob",
      x,
      y,
      vx: 0,
      vy: 0,
      rotation: 0,
      vr: 0,
      width: 42,
      height: 76,
      grabbed: false,
      name: "Noob",
      health: 100,
      maxHealth: 100,

      colors: {
        ...SETTINGS.colors
      }
    });

    updateLeaderboard();
    return;
  }

  if (type === "bomb") {

    objects.push({
      type: "bomb",
      x,
      y,
      vx: 0,
      vy: 0,
      rotation: 0,
      vr: 0,
      width: 34,
      height: 34,
      grabbed: false,
      name: "Bomb",
      fuse: 3,
      explosionTimer: 0,
      exploded: false
    });

    updateLeaderboard();
    return;
  }

  objects.push({
    type: "crate",
    x,
    y,
    vx: 0,
    vy: 0,
    rotation: 0,
    vr: 0,
    width: 58,
    height: 58,
    grabbed: false,
    name: "Crate"
  });

  updateLeaderboard();
}

function spawnNoob() {
  spawnObject("noob", W / 2, 120);
  showToast("Noob spawned!");
}

function spawnCrate() {
  spawnObject("crate", W / 2, 120);
  showToast("Crate spawned!");
}

function spawnBomb() {
  spawnObject("bomb", W / 2, 120);
  showToast("Bomb spawned!");
}

function resetSandbox() {

  player = null;
  objects.length = 0;

  updateStatus();
  updateLeaderboard();

  showToast("Sandbox reset!");
}

/* =========================
   LEGO DESTRUCTION
========================= */

function createBrokenNoobParts(c) {

  const parts = [
    {
      color: c.colors.head,
      x: c.x,
      y: c.y - 40,
      w: 40,
      h: 40
    },
    {
      color: c.colors.torso,
      x: c.x,
      y: c.y,
      w: 44,
      h: 40
    },
    {
      color: c.colors.leftArm,
      x: c.x - 32,
      y: c.y + 2,
      w: 15,
      h: 40
    },
    {
      color: c.colors.rightArm,
      x: c.x + 32,
      y: c.y + 2,
      w: 15,
      h: 40
    },
    {
      color: c.colors.leftLeg,
      x: c.x - 12,
      y: c.y + 38,
      w: 16,
      h: 39
    },
    {
      color: c.colors.rightLeg,
      x: c.x + 12,
      y: c.y + 38,
      w: 16,
      h: 39
    }
  ];

  for (const part of parts) {

    objects.push({
      type: "brokenPart",
      x: part.x,
      y: part.y,
      vx: (Math.random() - .5) * 850,
      vy: -250 - Math.random() * 500,
      rotation: (Math.random() - .5) * .5,
      vr: (Math.random() - .5) * 14,
      width: part.w,
      height: part.h,
      color: part.color,
      life: 2.2,
      grabbed: false,
      name: ""
    });
  }
}

function destroyNoob(noob) {

  createBrokenNoobParts(noob);

  const index = objects.indexOf(noob);

  if (index !== -1) {
    objects.splice(index, 1);
  }

  updateLeaderboard();
}

/* =========================
   HEALTH / BOMBS
========================= */

function damageNoob(noob, amount, forceX = 0, forceY = 0) {

  if (!noob || noob.health <= 0) {
    return;
  }

  noob.health = clamp(
    noob.health - amount,
    0,
    noob.maxHealth
  );

  noob.vx += forceX;
  noob.vy += forceY;

  updateLeaderboard();

  if (noob.health <= 0) {
    destroyNoob(noob);
  }
}

function explodeBomb(bomb) {

  if (bomb.exploded) {
    return;
  }

  bomb.exploded = true;
  bomb.explosionTimer = .28;

  const radius = 155;

  if (player) {

    const dx = player.x - bomb.x;
    const dy = player.y - bomb.y;
    const distance = Math.hypot(dx, dy);

    if (distance < radius) {

      const strength = 1 - distance / radius;
      const damage = 18 + strength * 82;
      const safeDistance = Math.max(distance, 1);
      const force = strength * 1050;

      damagePlayer(
        damage,
        dx / safeDistance * force,
        dy / safeDistance * force - 280
      );
    }
  }

  for (const obj of [...objects]) {

    if (
      obj === bomb ||
      obj.exploded ||
      obj.type === "brokenPart"
    ) {
      continue;
    }

    const dx = obj.x - bomb.x;
    const dy = obj.y - bomb.y;
    const distance = Math.hypot(dx, dy);

    if (distance < radius && distance > 0) {

      const strength = 1 - distance / radius;
      const force = strength * 1250;

      if (obj.type === "noob") {

        damageNoob(
          obj,
          18 + strength * 82,
          dx / distance * force,
          dy / distance * force - strength * 300
        );

      } else {

        obj.vx += dx / distance * force;
        obj.vy += dy / distance * force - strength * 300;
        obj.vr += (Math.random() - .5) * 22;
      }
    }
  }
}

function updateBomb(bomb, dt) {

  if (bomb.exploded) {
    bomb.explosionTimer -= dt;
    return;
  }

  bomb.fuse -= dt;

  if (bomb.fuse <= 0) {
    explodeBomb(bomb);
  }
}

function damagePlayer(amount, forceX = 0, forceY = 0) {

  if (!player || player.respawning) {
    return;
  }

  player.health = clamp(
    player.health - amount,
    0,
    player.maxHealth
  );

  player.vx += forceX;
  player.vy += forceY;

  if (player.health <= 0) {
    respawnPlayerSilently();
  }
}

function respawnPlayerSilently() {

  if (!player || player.respawning) {
    return;
  }

  player.respawning = true;

  setTimeout(() => {

    player = createPlayer(W / 2, 120);

    updateStatus();
    updateLeaderboard();

  }, 450);
}

/* =========================
   PLAYER PHYSICS
========================= */

function updatePlayer(dt) {

  if (!player || player.respawning) {
    return;
  }

  let direction = 0;

  if (leftPressed()) direction -= 1;
  if (rightPressed()) direction += 1;

  if (Math.abs(joystickX) > .05) {
    direction = joystickX;
  }

  const isRunning =
    SETTINGS.runningEnabled &&
    runPressed();

  player.running = isRunning;

  const targetSpeed =
    isRunning
      ? SETTINGS.runSpeed
      : SETTINGS.walkSpeed;

  if (Math.abs(direction) > .04) {

    player.vx +=
      direction *
      WORLD.playerAcceleration *
      dt;

    player.facing =
      direction > 0 ? 1 : -1;

  } else {

    const friction =
      player.grounded
        ? WORLD.playerGroundFriction
        : WORLD.playerAirFriction;

    player.vx =
      damp(
        player.vx,
        friction,
        dt
      );
  }

  player.vx =
    clamp(
      player.vx,
      -targetSpeed,
      targetSpeed
    );

  if (
    Math.abs(player.vx) < 5 &&
    player.grounded
  ) {
    player.vx = 0;
  }

  if (
    player.jumpRequested &&
    player.grounded
  ) {

    player.vy = -SETTINGS.jumpPower;
    player.grounded = false;
  }

  player.jumpRequested = false;

  player.vy += WORLD.gravity * dt;

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  const halfW = player.width / 2;
  const halfH = player.height / 2;

  if (player.x - halfW < 0) {

    player.x = halfW;

    if (player.vx < 0) {
      player.vx *= -WORLD.wallBounce;
    }
  }

  if (player.x + halfW > W) {

    player.x = W - halfW;

    if (player.vx > 0) {
      player.vx *= -WORLD.wallBounce;
    }
  }

  const floor = H - WORLD.floorHeight;

  if (player.y + halfH >= floor) {

    player.y = floor - halfH;

    if (player.vy > 0) {
      player.vy *= -.18;
    }

    if (Math.abs(player.vy) < 35) {
      player.vy = 0;
    }

    player.grounded = true;

  } else {

    player.grounded = false;
  }
}

/* =========================
   OBJECT PHYSICS
========================= */

function updateObject(obj, dt) {

  if (obj.type === "bomb") {
    updateBomb(obj, dt);
  }

  if (obj.type === "brokenPart") {
    obj.life -= dt;
  }

  if (obj.grabbed) {
    return;
  }

  if (
    obj.type === "bomb" &&
    obj.exploded
  ) {
    return;
  }

  obj.vy += WORLD.gravity * dt;

  obj.x += obj.vx * dt;
  obj.y += obj.vy * dt;

  obj.rotation += obj.vr * dt;

  const halfW = obj.width / 2;
  const halfH = obj.height / 2;

  if (obj.x - halfW < 0) {

    obj.x = halfW;

    if (obj.vx < 0) {
      obj.vx *= -WORLD.wallBounce;
    }
  }

  if (obj.x + halfW > W) {

    obj.x = W - halfW;

    if (obj.vx > 0) {
      obj.vx *= -WORLD.wallBounce;
    }
  }

  const floor = H - WORLD.floorHeight;

  const onGround =
    obj.y + halfH >= floor;

  if (onGround) {

    obj.y = floor - halfH;

    if (obj.vy > 0) {
      obj.vy *= -WORLD.objectBounce;
    }

    if (Math.abs(obj.vy) < 35) {
      obj.vy = 0;
    }

    obj.vx =
      damp(
        obj.vx,
        WORLD.objectGroundFriction,
        dt
      );

    obj.vr =
      damp(
        obj.vr,
        17,
        dt
      );

    if (Math.abs(obj.vx) < 8) {
      obj.vx = 0;
    }

    if (Math.abs(obj.vr) < .15) {
      obj.vr = 0;
    }

  } else {

    obj.vx =
      damp(
        obj.vx,
        WORLD.objectAirFriction,
        dt
      );
  }

  obj.vx =
    clamp(
      obj.vx,
      -WORLD.maxObjectSpeed,
      WORLD.maxObjectSpeed
    );
}

/* =========================
   COLLISIONS
========================= */

function overlap(a, b) {

  return (
    Math.abs(a.x - b.x) <
      (a.width + b.width) / 2 &&
    Math.abs(a.y - b.y) <
      (a.height + b.height) / 2
  );
}

function collidePlayerObject(p, o) {

  if (
    o.grabbed ||
    o.exploded ||
    o.type === "brokenPart" ||
    !overlap(p, o)
  ) {
    return;
  }

  const dx = p.x - o.x;
  const dy = p.y - o.y;

  const ox =
    (p.width + o.width) / 2 -
    Math.abs(dx);

  const oy =
    (p.height + o.height) / 2 -
    Math.abs(dy);

  if (ox <= 0 || oy <= 0) {
    return;
  }

  if (ox < oy) {

    const dir = dx >= 0 ? 1 : -1;

    p.x += dir * ox * .5;
    o.x -= dir * ox * .5;

    const average =
      (p.vx + o.vx) / 2;

    p.vx =
      average +
      dir *
      Math.abs(p.vx - average) *
      WORLD.collisionBounce;

    o.vx =
      average -
      dir *
      Math.abs(o.vx - average) *
      WORLD.collisionBounce;

  } else {

    const dir = dy >= 0 ? 1 : -1;

    p.y += dir * oy * .5;
    o.y -= dir * oy * .5;

    const average =
      (p.vy + o.vy) / 2;

    p.vy =
      average +
      dir *
      Math.abs(p.vy - average) *
      WORLD.collisionBounce;

    o.vy =
      average -
      dir *
      Math.abs(o.vy - average) *
      WORLD.collisionBounce;
  }
}

function collideObjects(a, b) {

  if (
    a.grabbed ||
    b.grabbed ||
    a.exploded ||
    b.exploded ||
    a.type === "brokenPart" ||
    b.type === "brokenPart" ||
    !overlap(a, b)
  ) {
    return;
  }

  const dx = a.x - b.x;
  const dy = a.y - b.y;

  const ox =
    (a.width + b.width) / 2 -
    Math.abs(dx);

  const oy =
    (a.height + b.height) / 2 -
    Math.abs(dy);

  if (ox <= 0 || oy <= 0) {
    return;
  }

  if (ox < oy) {

    const dir = dx >= 0 ? 1 : -1;

    a.x += dir * ox * .5;
    b.x -= dir * ox * .5;

    const average =
      (a.vx + b.vx) / 2;

    a.vx =
      average +
      dir *
      Math.abs(a.vx - average) *
      WORLD.collisionBounce;

    b.vx =
      average -
      dir *
      Math.abs(b.vx - average) *
      WORLD.collisionBounce;

  } else {

    const dir = dy >= 0 ? 1 : -1;

    a.y += dir * oy * .5;
    b.y -= dir * oy * .5;

    const average =
      (a.vy + b.vy) / 2;

    a.vy =
      average +
      dir *
      Math.abs(a.vy - average) *
      WORLD.collisionBounce;

    b.vy =
      average -
      dir *
      Math.abs(b.vy - average) *
      WORLD.collisionBounce;
  }
}

function solveCollisions() {

  if (player) {

    for (const obj of objects) {
      collidePlayerObject(player, obj);
    }
  }

  for (let i = 0; i < objects.length; i++) {

    for (let j = i + 1; j < objects.length; j++) {

      collideObjects(
        objects[i],
        objects[j]
      );
    }
  }
}

/* =========================
   DRAWING
========================= */

function roundedRect(x, y, w, h, r) {

  const radius =
    Math.min(r, w / 2, h / 2);

  ctx.beginPath();

  ctx.moveTo(x + radius, y);

  ctx.arcTo(
    x + w,
    y,
    x + w,
    y + h,
    radius
  );

  ctx.arcTo(
    x + w,
    y + h,
    x,
    y + h,
    radius
  );

  ctx.arcTo(
    x,
    y + h,
    x,
    y,
    radius
  );

  ctx.arcTo(
    x,
    y,
    x + w,
    y,
    radius
  );

  ctx.closePath();
}

function drawTexturedBlock(
  x,
  y,
  w,
  h,
  color,
  radius
) {

  ctx.fillStyle = color;

  roundedRect(
    x,
    y,
    w,
    h,
    radius
  );

  ctx.fill();

  ctx.strokeStyle =
    "rgba(0,0,0,.32)";

  ctx.lineWidth = 1.5;

  ctx.stroke();

  const gradient =
    ctx.createLinearGradient(
      0,
      y,
      0,
      y + h
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,.20)"
  );

  gradient.addColorStop(
    .25,
    "rgba(255,255,255,.05)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.13)"
  );

  ctx.fillStyle = gradient;

  roundedRect(
    x + 1,
    y + 1,
    w - 2,
    h - 2,
    Math.max(1, radius - 1)
  );

  ctx.fill();

  ctx.save();

  roundedRect(
    x + 1,
    y + 1,
    w - 2,
    h - 2,
    Math.max(1, radius - 1)
  );

  ctx.clip();

  ctx.fillStyle =
    "rgba(255,255,255,.045)";

  for (
    let px = x + 4;
    px < x + w;
    px += 7
  ) {

    for (
      let py = y + 4;
      py < y + h;
      py += 7
    ) {

      ctx.fillRect(
        px,
        py,
        1,
        1
      );
    }
  }

  ctx.restore();

  ctx.fillStyle =
    "rgba(255,255,255,.10)";

  ctx.fillRect(
    x + 1,
    y + 3,
    1,
    Math.max(2, h - 6)
  );

  ctx.fillStyle =
    "rgba(0,0,0,.13)";

  ctx.fillRect(
    x + 3,
    y + h - 2,
    Math.max(2, w - 6),
    1
  );
}

/* =========================
   NAME LABEL
========================= */

function drawName(
  name,
  x,
  y,
  health = null,
  maxHealth = null
) {

  if (!name) return;

  ctx.save();

  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const textWidth =
    ctx.measureText(name).width;

  const padding = 7;
  const boxWidth = textWidth + padding * 2;
  const boxHeight = 19;

  ctx.fillStyle =
    "rgba(8,6,14,.78)";

  roundedRect(
    x - boxWidth / 2,
    y - boxHeight / 2,
    boxWidth,
    boxHeight,
    7
  );

  ctx.fill();

  ctx.strokeStyle =
    "rgba(255,255,255,.12)";

  ctx.lineWidth = 1;

  ctx.stroke();

  ctx.fillStyle =
    "rgba(255,255,255,.92)";

  ctx.fillText(
    name,
    x,
    y + .5
  );

  if (
    health !== null &&
    maxHealth !== null
  ) {

    const barWidth =
      Math.max(
        32,
        Math.min(70, boxWidth)
      );

    const percent =
      clamp(
        health / maxHealth,
        0,
        1
      );

    ctx.fillStyle =
      "rgba(255,255,255,.12)";

    roundedRect(
      x - barWidth / 2,
      y - 16,
      barWidth,
      3,
      2
    );

    ctx.fill();

    ctx.fillStyle =
      percent > .5
        ? "#65d66f"
        : percent > .25
          ? "#f5c542"
          : "#ef5350";

    roundedRect(
      x - barWidth / 2,
      y - 16,
      barWidth * percent,
      3,
      2
    );

    ctx.fill();
  }

  ctx.restore();
}

/* =========================
   FACE
========================= */

function drawFace() {

  ctx.fillStyle = "#161219";

  ctx.beginPath();

  ctx.arc(
    -7,
    -46,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    7,
    -46,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle = "#161219";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  ctx.beginPath();

  ctx.arc(
    0,
    -42,
    7,
    .15,
    Math.PI - .15
  );

  ctx.stroke();

  ctx.lineCap = "butt";
}

function drawNoob(c, isPlayer = false) {

  ctx.scale(

  );

  );

    ctx.beginPath();

    ctx.moveTo(
      -30,
      31
    );

    ctx.lineTo(
      -39,
      35
    );

    ctx.moveTo(
      -28,
      37
    );

    ctx.lineTo(
      -37,
      42
    );

    ctx.stroke();
  }

  ctx.restore();
}

function drawBrokenPart(obj) {

  ctx.save();

  ctx.translate(
    obj.x,
    obj.y
  );

  ctx.rotate(
    obj.rotation
  );

  ctx.globalAlpha =
    clamp(
      obj.life / .35,
      0,
      1
    );

  drawTexturedBlock(
    -obj.width / 2,
    -obj.height / 2,
    obj.width,
    obj.height,
    obj.color,

  );

function drawCrate(obj) {

  );

  ctx.rotate(

  );

  drawName(

  );

  );

    -obj.width / 2 + 5,
    -obj.height / 2 + 5
  );

  ctx.lineTo(
    obj.width / 2 - 5,
    obj.height / 2 - 5
  );

  ctx.moveTo(
    obj.width / 2 - 5,
    -obj.height / 2 + 5
  );

  ctx.lineTo(
    -obj.width / 2 + 5,
    obj.height / 2 - 5
  );

  ctx.stroke();

  ctx.restore();
}

function drawBomb(bomb) {

  ctx.save();

  ctx.translate(
    bomb.x,
    bomb.y
  );

  drawName(
    bomb.name,
    0,
    -31
  );

  if (bomb.exploded) {

    const progress =
      clamp(
        bomb.explosionTimer / .28,
        0,
        1
      );

    const radius =
      20 +
      (1 - progress) * 125;

    ctx.globalAlpha = progress;

    ctx.fillStyle =
      "rgba(255,180,50,.28)";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
      "rgba(255,220,120,.85)";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      0,
      Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

    return;
  }

  ctx.rotate(
    bomb.rotation
  );

  ctx.fillStyle =
    "#17131d";

  ctx.beginPath();

  ctx.arc(
    0,
    4,
    15,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle =
    "rgba(255,255,255,.25)";

  ctx.lineWidth = 2;

  ctx.stroke();

  ctx.fillStyle =
    "rgba(255,255,255,.12)";

  ctx.beginPath();

  ctx.arc(
    -5,
    -1,
    5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle =
    "#92714c";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    7,
    -9
  );

  ctx.quadraticCurveTo(
    13,
    -17,
    10,
    -22
  );

  ctx.stroke();

  const spark =
    Math.floor(
      performance.now() / 90
    ) % 2 === 0;

  if (spark) {

    ctx.fillStyle = "#ffb52e";

    ctx.beginPath();

    ctx.arc(
      10,
      -23,
      4,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#fff0a0";

    ctx.beginPath();

    ctx.arc(
      10,
      -23,
      1.5,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.fillStyle = "white";

  ctx.font =
    "bold 9px Arial";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    Math.max(0, bomb.fuse).toFixed(1),
    0,
    5
  );

  ctx.restore();
}

/* =========================
   BACKGROUND
========================= */

function drawBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      W,
      H
    );

  gradient.addColorStop(
    0,
    "#090613"
  );

  gradient.addColorStop(
    .5,
    "#130b24"
  );

  gradient.addColorStop(
    1,
    "#08050f"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  const glow =
    ctx.createRadialGradient(
      W / 2,
      H * .42,
      20,
      W / 2,
      H * .42,
      Math.max(W,H) * .6
    );

  glow.addColorStop(
    0,
    "rgba(130,70,255,.12)"
  );

  glow.addColorStop(
    1,
    "rgba(130,70,255,0)"
  );

  ctx.fillStyle = glow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}

function drawGround() {

  ctx.fillStyle =
    "rgba(255,255,255,.055)";

  ctx.fillRect(
    0,
    H - WORLD.floorHeight,
    W,
    WORLD.floorHeight
  );

  ctx.fillStyle =
    "rgba(168,85,247,.18)";

  ctx.fillRect(
    0,
    H - WORLD.floorHeight,
    W,
    2
  );

  ctx.fillStyle =
    "rgba(255,255,255,.025)";

  for (
    let x = 0;
    x < W;
    x += 24
  ) {

    ctx.fillRect(
      x,
      H - WORLD.floorHeight + 8,
      1,
      WORLD.floorHeight - 12
    );
  }
}

function draw() {

  drawBackground();
  drawGround();

  for (const obj of objects) {

    if (obj.type === "noob") {

      drawNoob(obj, false);

    } else if (obj.type === "bomb") {

      drawBomb(obj);

    } else if (obj.type === "brokenPart") {

      drawBrokenPart(obj);

    } else {

      drawCrate(obj);
    }
  }

  if (player) {
    drawNoob(player, true);
  }
}

function updateLeaderboard() {

  leaderboardList.innerHTML = "";

  const people = [];

  if (player) {
    people.push(player);
  }

  for (const obj of objects) {

    if (obj.type === "noob") {
      people.push(obj);
    }
  }

  if (!people.length) {

    leaderboardList.innerHTML =
      `<div class="leader-empty">
        No characters
      </div>`;

    return;
  }

  people.forEach(
    (person, index) => {

      const row =
        document.createElement("div");

      row.className =
        "leader-row";

      const main =
        document.createElement("div");

      main.className =
        "leader-main";

      const nameLine =
        document.createElement("div");

      nameLine.className =
        "leader-name-line";

      const name =
        document.createElement("span");

      name.className =
        "leader-name";

      name.textContent =
        person.name || "Unnamed";

      const type =
        document.createElement("span");

      type.className =
        "leader-type";

      type.textContent =
        person.type === "player"
          ? "PLAYER"
          : "NOOB";

      nameLine.appendChild(name);
      nameLine.appendChild(type);

      const track =
        document.createElement("div");

      track.className =
        "leader-health-track";

      const bar =
        document.createElement("div");

      bar.className =
        "leader-health-bar";

      const maxHealth =
        Math.max(
          1,
          person.maxHealth || 100
        );

      const health =
        clamp(
          person.health ?? maxHealth,
          0,
          maxHealth
        );

      const percent =
        health / maxHealth;

      bar.style.width =
        `${percent * 100}%`;

      bar.style.background =
        percent > .5
          ? "#65d66f"
          : percent > .25
            ? "#f5c542"
            : "#ef5350";

      track.appendChild(bar);

      const healthText =
        document.createElement("div");

      healthText.className =
        "leader-health-text";

      healthText.textContent =
        `${Math.ceil(health)} / ${maxHealth}`;

      main.appendChild(nameLine);
      main.appendChild(track);
      main.appendChild(healthText);

      const rename =
        document.createElement("button");

      rename.type = "button";
      rename.className = "rename-button";
      rename.textContent = "✎";
      rename.title = "Rename";
      rename.dataset.index = index;

      row.appendChild(main);
      row.appendChild(rename);

      leaderboardList.appendChild(row);
    }
  );
}

/* =========================
   GRABBING / THROWING
========================= */

let grabbed = null;
let grabPointer = null;

let grabOffsetX = 0;
let grabOffsetY = 0;

const dragHistory = [];

function inside(x, y, body) {

  return (
    x >= body.x - body.width / 2 &&
    x <= body.x + body.width / 2 &&
    y >= body.y - body.height / 2 &&
    y <= body.y + body.height / 2
  );
}

function findTarget(x, y) {

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    if (objects[i].type === "brokenPart") {
      continue;
    }

    if (inside(x, y, objects[i])) {
      return objects[i];
    }
  }

  if (
    player &&
    !player.respawning &&
    inside(x, y, player)
  ) {
    return player;
  }

  return null;
}

function recordDrag(x, y) {

  const now = performance.now();

  dragHistory.push({
    x,
    y,
    time: now
  });

  while (
    dragHistory.length > 14 ||
    now - dragHistory[0].time > 180
  ) {
    dragHistory.shift();
  }
}

function throwVelocity() {

  if (dragHistory.length < 2) {
    return { vx: 0, vy: 0 };
  }

  const latest =
    dragHistory[
      dragHistory.length - 1
    ];

  let old =
    dragHistory[0];

  for (
    let i = dragHistory.length - 1;
    i >= 0;
    i--
  ) {

    if (
      latest.time -
      dragHistory[i].time >= 35
    ) {

      old = dragHistory[i];
      break;
    }
  }

  const dt =
    Math.max(
      .016,
      (latest.time - old.time) / 1000
    );

  let vx =
    (latest.x - old.x) / dt;

  let vy =
    (latest.y - old.y) / dt;

  vx *= 1.8;
  vy *= 1.8;

  const speed =
    Math.hypot(vx, vy);

  if (
    speed >
    WORLD.maxObjectSpeed
  ) {

    const scale =
      WORLD.maxObjectSpeed / speed;

    vx *= scale;
    vy *= scale;
  }

  return {
    vx,
    vy
  };
}

function pointerDown(e) {

  const rect =
    canvas.getBoundingClientRect();

  const x =
    e.clientX - rect.left;

  const y =
    e.clientY - rect.top;

  const target =
    findTarget(x, y);

  if (!target) {
    return;
  }

  if (
    target.type === "bomb" &&
    target.exploded
  ) {
    return;
  }

  grabbed = target;
  grabPointer = e.pointerId;

  grabOffsetX =
    target.x - x;

  grabOffsetY =
    target.y - y;

  target.vx = 0;
  target.vy = 0;
  target.vr = 0;

  if (target === player) {
    player.grounded = false;
  }

  dragHistory.length = 0;

  recordDrag(x, y);

  canvas.setPointerCapture(
    e.pointerId
  );
}

function pointerMove(e) {

  if (
    !grabbed ||
    e.pointerId !== grabPointer
  ) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const x =
    e.clientX - rect.left;

  const y =
    e.clientY - rect.top;

  recordDrag(x, y);

  grabbed.x =
    x + grabOffsetX;

  grabbed.y =
    y + grabOffsetY;

  grabbed.vx = 0;
  grabbed.vy = 0;
  grabbed.vr = 0;

  const halfW =
    grabbed.width / 2;

  const halfH =
    grabbed.height / 2;

  grabbed.x =
    clamp(
      grabbed.x,
      halfW,
      W - halfW
    );

  grabbed.y =
    clamp(
      grabbed.y,
      halfH,
      H - WORLD.floorHeight - halfH
    );
}

function pointerUp(e) {

  if (
    !grabbed ||
    e.pointerId !== grabPointer
  ) {
    return;
  }

  const velocity =
    throwVelocity();

  grabbed.vx =
    velocity.vx;

  grabbed.vy =
    velocity.vy;

  if (grabbed !== player) {
    grabbed.vr =
      velocity.vx * .008;
  }

  if (grabbed === player) {
    player.grounded = false;
  }

  grabbed = null;
  grabPointer = null;

  dragHistory.length = 0;
}

canvas.addEventListener(
  "pointerdown",
  pointerDown
);

canvas.addEventListener(
  "pointermove",
  pointerMove
);

canvas.addEventListener(
  "pointerup",
  pointerUp
);

canvas.addEventListener(
  "pointercancel",
  pointerUp
);

/* =========================
   DRAGGABLE SPAWN MENU
========================= */

const spawnHeader =
  document.getElementById(
    "spawnHeader"
  );

let draggingMenu = false;

let dragStartX = 0;
let dragStartY = 0;

let originalRight = 16;
let originalBottom = 82;

spawnHeader.addEventListener(
  "pointerdown",
  e => {

    draggingMenu = true;

    const rect =
      spawnMenu.getBoundingClientRect();

    dragStartX =
      e.clientX;

    dragStartY =
      e.clientY;

    originalRight =
      window.innerWidth -
      rect.right;

    originalBottom =
      window.innerHeight -
      rect.bottom;

    spawnHeader.setPointerCapture(
      e.pointerId
    );
  }
);

spawnHeader.addEventListener(
  "pointermove",
  e => {

    if (!draggingMenu) {
      return;
    }

    const dx =
      e.clientX - dragStartX;

    const dy =
      e.clientY - dragStartY;

    const rect =
      spawnMenu.getBoundingClientRect();

    let right =
      originalRight - dx;

    let bottom =
      originalBottom - dy;

    right =
      clamp(
        right,
        8,
        window.innerWidth -
          rect.width -
          8
      );

    bottom =
      clamp(
        bottom,
        8,
        window.innerHeight -
          rect.height -
          8
      );

    spawnMenu.style.right =
      right + "px";

    spawnMenu.style.bottom =
      bottom + "px";

    spawnMenu.style.left =
      "auto";
  }
);

function stopMenuDrag() {
  draggingMenu = false;
}

spawnHeader.addEventListener(
  "pointerup",
  stopMenuDrag
);

spawnHeader.addEventListener(
  "pointercancel",
  stopMenuDrag
);

/* =========================
   GAME LOOP
========================= */

let lastTime =
  performance.now();

function gameLoop(now) {

  let dt =
    (now - lastTime) / 1000;

  lastTime =
    now;

  dt =
    Math.min(
      dt,
      .033
    );

  updatePlayer(dt);

  for (const obj of objects) {

    updateObject(
      obj,
      dt
    );
  }

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const obj =
      objects[i];

    if (
      obj.type === "bomb" &&
      obj.exploded &&
      obj.explosionTimer <= 0
    ) {

      objects.splice(
        i,
        1
      );

      continue;
    }

    if (
      obj.type === "brokenPart" &&
      obj.life <= 0
    ) {

      objects.splice(
        i,
        1
      );
    }
  }

  solveCollisions();

  updateLeaderboard();

  draw();

  requestAnimationFrame(
    gameLoop
  );
}

updateStatus();
updateLeaderboard();

requestAnimationFrame(
  gameLoop
);
